function el(id){return document.getElementById(id)}function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){s.page=p;s.feedback=null;s.selected=null;render();window.scrollTo(0,0)}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3700)}
let voiceWarned=false;
function speak(t,slow=false){if(!('speechSynthesis'in window)){toast('La lecture vocale n’est pas disponible sur ce navigateur.');return}let synth=window.speechSynthesis;synth.cancel();let vs=synth.getVoices();let v=vs.find(x=>/^lb([-_]|$)/i.test(x.lang))||vs.find(x=>/luxemb/i.test(x.name));let fallback=!v;if(!v)v=vs.find(x=>/^de([-_]|$)/i.test(x.lang))||vs.find(x=>/^fr([-_]|$)/i.test(x.lang));let u=new SpeechSynthesisUtterance(t);if(v)u.voice=v;u.lang=v?v.lang:'lb-LU';u.rate=slow?.67:.88;u.pitch=1.05;synth.speak(u);if(fallback&&!voiceWarned){voiceWarned=true;toast('Voix luxembourgeoise non installée : prononciation de remplacement approximative.')} }
function stats(){return `<div class="stats"><span>🔥 ${s.streak}</span><span>💎 ${s.gems}</span><span>❤️ ${s.hearts}</span></div>`}function appHeader(title,back){return `<header class="top"><button class="header-link" onclick="go('${back}')">‹</button><strong>${title}</strong>${stats()}</header>`}function nav(){return `<nav class="bottom"><button class="${s.page==='chapters'?'on':''}" onclick="go('chapters')"><span class="ico">📚</span>Chapitres</button><button class="${s.page==='treasures'?'on':''}" onclick="go('treasures')"><span class="ico">🎁</span>Trésors</button><button class="${s.page==='profile'?'on':''}" onclick="go('profile')"><span class="ico">🦊</span>Profil</button></nav>`}
function count(c){return Object.keys(s.done).filter(x=>x.startsWith(c+'-')).length}function isOpen(c){return c===0||count(c-1)>=4}function chapterCards(){return chapters.map(([name,color,i])=>`<button class="chapter ${color} ${!isOpen(i)?'locked':''}" onclick="openChapter(${i})"><img src="${ART[i]}"><div class="details"><small>A1 · Chapitre ${i+1}</small><b>${name}</b>${isOpen(i)?`<span class="progress"><i style="width:${count(i)/6*100}%"></i></span><small>${count(i)}/6</small>`:''}</div><span class="right">${isOpen(i)?'›':'🔒'}</span></button>`).join('')}

function lessonStart(i){if(i>0&&!s.done[s.chapter+'-'+(i-1)]){toast('Termine la leçon précédente pour débloquer celle-ci.');return}s.lesson=i;go('lesson')}
function makeQuestions(){let pack=packs[s.chapter],item=pack[s.lesson];let other=pack.filter((_,i)=>i!==s.lesson);let pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);let opts=(correct,arr)=>pick([correct,...pick(arr.filter(x=>x!==correct),3)],4);let words=item.lb.replace(/[?!]/g,'').split(' ');let q=[{type:'listen',item},{type:'choice',item,choices:opts(item.lb,other.map(x=>x.lb)),prompt:`Comment dit-on « ${item.fr} » ?`,correct:item.lb},{type:'image',item,choices:pick([item,...pick(other,3)],4)},{type:'fr',item,choices:opts(item.fr,other.map(x=>x.fr)),correct:item.fr},{type:'order',item,words},{type:'audiochoice',item,choices:opts(item.lb,other.map(x=>x.lb)),correct:item.lb},{type:'write',item},{type:'review',item:other[(s.lesson+1)%other.length]||item,choices:opts((other[(s.lesson+1)%other.length]||item).fr,other.map(x=>x.fr)),correct:(other[(s.lesson+1)%other.length]||item).fr}];return q}

if(q.type==='listen')content+=`<h2>Écoute et répète cette phrase</h2><div class="art"><img src="${FOX}"></div><div class="speech">${escapeHTML(q.item.lb)}</div><button class="audio" onclick="speak('${q.item.lb.replace(/'/g,"\\'")}')">🔊</button><div class="center"><button class="audio small" onclick="speak('${q.item.lb.replace(/'/g,"\\'")}',true)">🐢</button><button class="audio small" onclick="record()">🎙️</button></div><p class="note center">Écoute la phrase, puis répète-la à voix haute.</p>`;
if(q.type==='choice'||q.type==='fr'||q.type==='audiochoice'||q.type==='review')content+=`<h2>${q.type==='fr'||q.type==='review'?'Choisis la bonne traduction':q.type==='audiochoice'?'Écoute et choisis la bonne réponse':q.prompt}</h2>${q.type==='audiochoice'?`<button class="audio" onclick="speak(${JSON.stringify(q.item.lb).replace(/"/g,'&quot;')})">🔊</button>`:`<div class="art">${q.item.pic}</div>`}<div class="answers">${q.choices.map((x,i)=>`<button class="answer ${s.selected===i?'chosen':''}" onclick="choose(${i})">${escapeHTML(x)}</button>`).join('')}</div>`;
if(q.type==='image')content+=`<h2>Quelle image correspond à « ${escapeHTML(q.item.fr)} » ?</h2><div class="grid-img">${q.choices.map((x,i)=>`<button class="imgchoice ${s.selected===i?'chosen':''}" onclick="choose(${i})">${x.pic}</button>`).join('')}</div>`;
if(q.type==='order')content+=`<h2>Remets la phrase dans le bon ordre</h2><div class="pill">${escapeHTML(q.item.fr)}</div><div class="speech" style="min-height:65px">${s.order.map(i=>escapeHTML(q.words[i])).join(' ')||'Appuie sur les mots ci-dessous'}</div><div class="tiles">${q.words.map((w,i)=>`<button class="tile ${s.order.includes(i)?'used':''}" onclick="addWord(${i})" ${s.order.includes(i)?'disabled':''}>${escapeHTML(w)}</button>`).join('')}</div><button class="secondary" onclick="s.order=[];render()">Effacer</button>`;
if(q.type==='write')content+=`<h2>Écris la traduction en luxembourgeois</h2><div class="art">${q.item.pic}</div><div class="pill">${escapeHTML(q.item.fr)}</div><button class="audio small" onclick='speak(${JSON.stringify(q.item.lb)})'>🔊</button><input class="input" id="writing" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Écris en luxembourgeois" value="${escapeHTML(s.typed)}" oninput="s.typed=this.value">`;
content+=`<div class="spacer"></div>${s.feedback?`<div class="feedback ${s.feedback.ok?'':'bad'}">${s.feedback.ok?'✨ Bravo !':'💡 Bonne réponse : '+escapeHTML(s.feedback.correct)}</div>`:''}<button class="primary" onclick="nextQuestion()">${s.feedback?'Continuer':q.type==='listen'?'J’ai écouté':'Vérifier'}</button><p class="note center">${s.q+1} / ${s.questions.length} exercices · Révisions variées</p>`;return appHeader('Leçon '+(s.lesson+1),'lesson')+`<main class="page exercise">${content}</main>`}
function record(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('La reconnaissance vocale n’est pas disponible ici. Répète à voix haute.');return}let r=new R();r.lang='lb-LU';r.onresult=e=>toast('Reconnu : '+e.results[0][0].transcript+' (reconnaissance expérimentale)');r.onerror=()=>toast('Reconnaissance luxembourgeoise indisponible sur cet appareil.');r.start();toast('Parle maintenant…')}
function choose(i){if(s.feedback)return;s.selected=i;render()}function addWord(i){if(s.feedback)return;if(!s.order.includes(i))s.order.push(i);render()}
function norm(x){return x.toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function nextQuestion(){let q=s.questions[s.q];if(!s.feedback){let correct=q.correct||q.item.lb;let ok=false;if(q.type==='listen')ok=true;else if(q.type==='order')ok=norm(s.order.map(i=>q.words[i]).join(' '))===norm(q.item.lb);else if(q.type==='write')ok=norm(s.typed)===norm(q.item.lb);else if(q.type==='image')ok=q.choices[s.selected]===q.item;else ok=q.choices[s.selected]===correct;if(!ok&&s.selected===null&&q.type!=='order'&&q.type!=='write'){toast('Choisis une réponse avant de continuer.');return}if(!ok&&q.type==='order'&&!s.order.length){toast('Construis la phrase avant de vérifier.');return}if(!ok&&q.type==='write'&&!s.typed.trim()){toast('Écris une réponse avant de vérifier.');return}if(!ok)s.hearts=Math.max(0,s.hearts-1);else s.xp+=10*(s.bonus?2:1);s.feedback={ok,correct:q.type==='image'?q.item.pic:q.type==='fr'||q.type==='review'?q.item.fr:q.item.lb};persist();render();return}if(s.q===s.questions.length-1){complete();return}s.q++;s.selected=null;s.order=[];s.typed='';s.feedback=null;render();window.scrollTo(0,0)}
function complete(){let k=s.chapter+'-'+s.lesson;let first=!s.done[k];if(first){s.done[k]=true;s.stars+=3;s.gems+=10;s.streak+=1}if(s.bonus)s.bonus=Math.max(0,s.bonus-1);persist();go('complete')}
function chestAvailable(c,i){return s.done[c+'-'+i]&&!s.claimed[c+'-'+i]}
function claim(c,i){let k=c+'-'+i;if(!chestAvailable(c,i)){toast('Termine la leçon associée pour ouvrir ce coffre.');return}s.claimed[k]=true;s.gems+=35;s.xp+=50;s.hearts=Math.min(5,s.hearts+1);persist();s.chestKey=k;go('reward')}
function chapterPage(){let c=s.chapter;return appHeader(chapters[c][0],'chapters')+`<main class="page"><div class="lesson-card"><img src="${ART[c]}"><h2>${chapters[c][0]}</h2><p>6 leçons · 8 exercices variés par leçon</p><div class="progress"><i style="width:${count(c)/6*100}%"></i></div> ${count(c)}/6</div>${packs[c].map((x,i)=>`<button class="lesson-row" onclick="lessonStart(${i})"><span class="num">${s.done[c+'-'+i]?'⭐':i===0||s.done[c+'-'+(i-1)]?'▶️':'🔒'}</span><span>Leçon ${i+1}<br><small>${escapeHTML(x.fr)}</small></span><span class="meta">${s.done[c+'-'+i]?'★★★':'›'}</span></button>${(i===1||i===4)?`<button class="lesson-row" onclick="claim(${c},${i})" style="background:#fff3ce"><span class="num">🎁</span><span>Coffre surprise<br><small>Gemmes, XP et vie</small></span><span class="meta">${s.claimed[c+'-'+i]?'✓':chestAvailable(c,i)?'OUVRIR':'🔒'}</span></button>`:''}`).join('')}</main>`}
function render(){let h='';if(s.page==='intro')h=`<main class="page"><div class="hero"><div class="brand">Lëtz<em>Learn</em></div><p>Apprends le luxembourgeois<br>en t’amusant !</p><img src="${INTRO}"><h1>Moien ! 🦊</h1><p>Des petits défis, de grandes aventures.</p><button class="primary" onclick="go('chapters')">Commencer</button></div><p class="center note">A1 · Apprendre à son rythme · Récompenses</p></main>`;
if(s.page==='chapters')h=appHeader('Chapitres','intro')+`<main class="page"><h2 class="section">Choisis ton aventure ✨</h2>${chapterCards()}<p class="note">Termine quatre leçons pour débloquer le chapitre suivant. Les coffres apparaissent après certaines leçons.</p></main>`+nav();
if(s.page==='chapter')h=chapterPage()+nav();
if(s.page==='lesson'){let item=packs[s.chapter][s.lesson];h=appHeader('Leçon '+(s.lesson+1),'chapter')+`<main class="page"><div class="lesson-card"><img src="${FOX}"><h2>${escapeHTML(item.lb)} !</h2><p>Apprenons : ${escapeHTML(item.fr.toLowerCase())}</p></div><div class="step"><span>🔊</span>Écouter et répéter</div><div class="step"><span>🧩</span>Choisir et associer</div><div class="step"><span>📝</span>Écrire et remettre en ordre</div><div class="step"><span>⭐</span>Gagner des étoiles</div><p class="pill">8 exercices pour pratiquer la même expression de plusieurs façons.</p><button class="primary" onclick="startExercise()">Commencer la leçon</button></main>`}
if(s.page==='exercise')h=exercise();
if(s.page==='complete')h=appHeader('Leçon terminée !','chapter')+`<main class="page center"><div class="confetti">🎊 🦊 🎉</div><img src="${FOX}" style="max-width:240px;width:80%;border-radius:25px"><h1>Leçon terminée !</h1><div class="stars">⭐⭐⭐</div><div class="reward-prizes"><div>⚡<small>XP gagnés</small></div><div>💎<small>+10 gemmes*</small></div><div>⭐<small>3 étoiles*</small></div></div><p class="note">*Récompenses de première réussite uniquement. Tu peux rejouer chaque leçon pour réviser.</p><button class="primary" onclick="go('chapter')">Retour aux leçons</button></main>`;
if(s.page==='reward')h=appHeader('Coffre de récompense','chapter')+`<main class="page"><div class="reward"><h2>Trésor découvert !</h2><div class="chest">🧰✨</div><p>Une belle surprise pour tes efforts !</p></div><div class="reward-prizes"><div>💎 +35<small>Gemmes</small></div><div>⚡ +50<small>XP</small></div><div>❤️ +1<small>Vie</small></div></div><button class="primary" onclick="go('chapter')">Super !</button></main>`;
if(s.page==='treasures')h=appHeader('Trésors','chapters')+`<main class="page"><div class="reward"><h2>🎁 Ton trésor</h2><div class="chest">🧰</div><p>Ouvre les coffres après les leçons 2 et 5 de chaque chapitre.</p></div><div class="reward-prizes"><div>💎 ${s.gems}<small>Gemmes</small></div><div>⭐ ${s.stars}<small>Étoiles</small></div><div>⚡ ${s.xp}<small>XP</small></div></div><h2>La boutique des bonus</h2><div class="step"><span>❤️</span><div>Une vie supplémentaire<br><small>50 gemmes</small></div><button class="secondary" onclick="buy('heart')">Acheter</button></div><div class="step"><span>⚡</span><div>XP doublés pour 1 leçon<br><small>80 gemmes</small></div><button class="secondary" onclick="buy('xp')">Acheter</button></div><p class="pill">⭐ 12 étoiles : tu obtiens une nouvelle vie en cadeau !</p><button class="secondary" onclick="starGift()">Échanger 12 étoiles</button></main>`+nav();
if(s.page==='profile')h=appHeader('Mon profil','chapters')+`<main class="page center"><img src="${FOX}" style="width:180px;border-radius:30px"><h2>Mon aventure LëtzLearn</h2><div class="reward-prizes"><div>⚡ ${s.xp}<small>XP</small></div><div>⭐ ${s.stars}<small>Étoiles</small></div><div>💎 ${s.gems}<small>Gemmes</small></div></div><p class="pill">🔥 ${s.streak} leçons terminées · ❤️ ${s.hearts}/5 vies</p><h2 class="section">Ma progression A1</h2>${chapters.map((c,i)=>`<div class="step">${c[0]} <span style="margin-left:auto">${count(i)}/6</span></div>`).join('')}<p class="note">Progression sauvegardée sur cet appareil.</p></main>`+nav();
el('app').innerHTML=h}
function buy(type){let cost=type==='heart'?50:80;if(s.gems<cost){toast('Pas assez de gemmes ! Ouvre des coffres pour en gagner.');return}if(type==='heart'&&s.hearts>=5){toast('Tu as déjà toutes tes vies.');return}s.gems-=cost;if(type==='heart')s.hearts++;else s.bonus++;persist();render();toast('Bonus acheté !')}
function starGift(){if(s.stars<12){toast('Il te faut 12 étoiles.');return}if(s.hearts>=5){toast('Tes vies sont déjà au maximum.');return}s.stars-=12;s.hearts++;persist();render();toast('Une vie gagnée grâce aux étoiles !')}
render();if('speechSynthesis'in window){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices()}
</script></body></html>
