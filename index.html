<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c48"><title>LëtzLearn — Apprendre le luxembourgeois</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#16324c;background:#eef5fa}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{background:#123854;color:white;padding:24px 18px 18px;border-radius:0 0 24px 24px}.wrap{max-width:720px;margin:auto;padding:0 16px 90px}.brand{font-size:26px;font-weight:900}.sub{opacity:.78}.stats{display:flex;gap:10px;margin:18px 0}.pill{background:#ffffff1e;border:1px solid #ffffff44;padding:8px 12px;border-radius:14px}h2{font-size:22px;margin:24px 0 14px}.card{background:white;border:1px solid #dce7ef;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #1e49620b}.chapter{display:flex;align-items:center;gap:14px}.chapter .info{flex:1}.small{font-size:13px;color:#61798b}.tag{background:#e8f4ff;color:#135c92;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800}.btn{border:0;background:#087ab3;color:white;padding:12px 16px;border-radius:13px;font-weight:800}.btn:disabled{background:#d4dce2;color:#657788}.ghost{background:#eef6fa;color:#155072}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;border-top:1px solid #dce7ef;padding:10px 5px max(12px,env(safe-area-inset-bottom));z-index:10}.tabs button{border:0;background:transparent;flex:1;max-width:150px;font-size:12px;color:#536c7d;padding:5px}.tabs button.active{color:#087ab3;font-weight:900}.hidden{display:none}.options{display:grid;gap:10px;margin:18px 0}.option{background:white;border:2px solid #d6e6ef;padding:16px;text-align:left;border-radius:14px}.option.selected{border-color:#087ab3;background:#eaf7ff}.option.correct{border-color:#20986c;background:#e5fff2}.option.wrong{border-color:#d24d52;background:#fff0f0}.progress{height:9px;background:#d9e8f1;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#1da27a;transition:width .2s}.word{display:inline-block;margin:5px;padding:10px 14px;background:white;border:2px solid #c9dce8;border-radius:12px}.word.selected{background:#d4edff;border-color:#1681bb}.matchcol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.matchcol button{min-height:55px}.notice{background:#fff5dd;padding:12px;border-radius:12px;color:#775318;font-size:13px}.level{font-size:13px;color:#5a758a;font-weight:900}.lesson{padding:12px;border-top:1px solid #edf2f6;display:flex;align-items:center;justify-content:space-between;gap:8px}.lesson:first-of-type{margin-top:10px}.feedback{padding:12px;border-radius:12px;background:#eaf7ff;margin:12px 0}.success{background:#e6fff0}.danger{background:#fff0f0}input{padding:12px;border:1px solid #bcd2e1;border-radius:12px;width:100%}</style></head><body>
<header><div class="wrap" style="padding:0"><div class="brand">🦊 LëtzLearn</div><div class="sub">Le luxembourgeois, pas à pas 🇱🇺</div><div class="stats"><span class="pill" id="xp">⭐ 0 XP</span><span class="pill" id="streak">🔥 0 jour</span><span class="pill" id="hearts">❤️ 5</span></div></div></header>
<main class="wrap"><section id="home"></section><section id="courses" class="hidden"></section><section id="vocab" class="hidden"></section><section id="profile" class="hidden"></section><section id="exercise" class="hidden"></section></main><nav class="tabs" id="tabs"><button data-tab="home">🏠<br>Accueil</button><button data-tab="courses">🗺️<br>Parcours</button><button data-tab="vocab">📚<br>Vocabulaire</button><button data-tab="profile">👤<br>Profil</button></nav>
<script>
let curriculum,exerciseData;const storeKey='letzlearn-v3';let state;try{state=JSON.parse(localStorage.getItem(storeKey))||{xp:0,hearts:5,streak:0,completed:[],saved:[],pro:false}}catch{state={xp:0,hearts:5,streak:0,completed:[],saved:[],pro:false}}let current=null,step=0,selected=null,score=0,matchSelected=null,matched=[],order=[];const $=id=>document.getElementById(id),save=()=>{localStorage.setItem(storeKey,JSON.stringify(state));updateStats()},escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function updateStats(){$('xp').textContent='⭐ '+state.xp+' XP';$('hearts').textContent='❤️ '+state.hearts;$('streak').textContent='🔥 '+state.streak+' jour'+(state.streak>1?'s':'')}function tab(t){for(let id of ['home','courses','vocab','profile','exercise'])$(id).classList.toggle('hidden',id!==t);$('tabs').classList.toggle('hidden',t==='exercise');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='home')home();if(t==='courses')courses();if(t==='vocab')vocab();if(t==='profile')profile();window.scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function home(){let done=state.completed.length;$('home').innerHTML=`<h2>Moien ! 👋</h2><div class="card"><div class="level">TON AVENTURE</div><h2>Apprends le luxembourgeois</h2><p>Des leçons courtes, de l’écoute et des révisions régulières.</p><button class="btn" onclick="tab('courses')">Commencer à apprendre</button></div><div class="card"><strong>Ta progression</strong><p>${done} leçon(s) terminée(s) · ${state.xp} XP</p><div class="progress"><div style="width:${Math.min(done/1000*100,100)}%"></div></div><p class="small">Objectif : 1 000 leçons réparties en 100 chapitres.</p></div><div class="card"><strong>🎯 Programme pédagogique</strong><p>100 chapitres planifiés, 10 leçons par chapitre, objectif de 15 exercices par leçon.</p><div class="notice">Les deux premières leçons A1 sont jouables. Les autres sont identifiées comme « En préparation » : nous n’affichons pas de faux exercices.</div></div>`}
function courses(){let html='<h2>Parcours d’apprentissage</h2><p class="small">100 chapitres prévus · 1 000 leçons prévues · 15 000 exercices visés</p>';for(let level of ['A1','A2','B1','B2']){html+=`<h2>${level} <span class="small">25 chapitres</span></h2>`;for(let ch of curriculum.chapters.filter(x=>x.level===level)){let ready=ch.lessons.filter(x=>x.status==='available').length;html+=`<details class="card"><summary class="chapter" style="cursor:pointer"><div style="font-size:30px">${level==='A1'?'🌱':level==='A2'?'🌿':level==='B1'?'🌳':'🏔️'}</div><div class="info"><strong>${escapeHtml(ch.title)}</strong><div class="small">10 leçons · ${ready} jouable(s)</div></div><span class="tag">${level}</span></summary>`;for(let l of ch.lessons){let ok=l.status==='available';html+=`<div class="lesson"><div><strong>${escapeHtml(l.title)}</strong><div class="small">${state.completed.includes(l.id)?'✓ Terminée':ok?'15 exercices':'En préparation'}</div></div><button class="btn ${ok?'':'ghost'}" ${ok?`onclick="start('${l.id}')"`:'disabled'}>${ok?'Jouer':'🔒'}</button></div>`}html+='</details>'}}$('courses').innerHTML=html}
function vocab(){let entries=[['Moien','Bonjour'],['Äddi','Au revoir'],['Jo','Oui'],['Nee','Non'],['Merci','Merci'],['W.e.g.','S’il vous plaît'],['Et geet mir gutt','Je vais bien'],['Wéi geet et dir?','Comment vas-tu ?']];$('vocab').innerHTML='<h2>Mon vocabulaire</h2><p class="small">Écoute les mots et ajoute-les à tes favoris.</p>'+entries.map(([lu,fr])=>`<div class="card chapter"><div class="info"><strong>${escapeHtml(lu)}</strong><div class="small">${escapeHtml(fr)}</div></div><button class="btn ghost" onclick='speak(${JSON.stringify(lu)})'>🔊</button><button class="btn ghost" onclick='favorite(${JSON.stringify(lu)})'>${state.saved.includes(lu)?'★':'☆'}</button></div>`).join('')+'<div class="notice">Les voix luxembourgeoises dépendent du navigateur. Une bibliothèque audio enregistrée sera nécessaire pour une prononciation fiable.</div>'}
function favorite(w){state.saved=state.saved.includes(w)?state.saved.filter(x=>x!==w):[...state.saved,w];save();vocab()}
function profile(){$('profile').innerHTML=`<h2>Mon profil</h2><div class="card"><h3>📊 Statistiques</h3><p>XP : ${state.xp}</p><p>Leçons terminées : ${state.completed.length}</p><p>Favoris : ${state.saved.length}</p></div><div class="card"><h3>👑 LëtzLearn Pro</h3><p>Offre envisagée : <strong>6,99 €/mois</strong>.</p><p>Accès illimité aux cours publiés, révisions avancées et entraînements.</p><div class="notice">Le paiement et l’abonnement ne sont pas encore actifs. Aucun achat ne peut être effectué sur cette version.</div><button class="btn" disabled>Abonnement bientôt disponible</button></div><div class="card"><h3>⚙️ Paramètres</h3><p>Progression enregistrée sur cet appareil uniquement.</p><p>Comptes, synchronisation, notifications et paiements : en préparation.</p></div>`}
function speak(w){if(!('speechSynthesis'in window))return alert('Audio non disponible sur ce navigateur');let u=new SpeechSynthesisUtterance(w);u.lang='lb-LU';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}
function start(id){current=id;step=0;score=0;selected=null;state.hearts=Math.max(state.hearts,1);tab('exercise');renderQuestion()}
function renderQuestion(){let q=exerciseData[current][step];if(!q){finish();return}let pct=Math.round(step/exerciseData[current].length*100);let html=`<div style="margin:22px 0"><button class="btn ghost" onclick="tab('courses')">← Quitter</button></div><div class="progress"><div style="width:${pct}%"></div></div><p class="small">Exercice ${step+1} / ${exerciseData[current].length} · ${score} bonne(s) réponse(s)</p><div class="card"><h2>${escapeHtml(q.prompt)}</h2>`;if(q.say)html+=`<button class="btn ghost" onclick='speak(${JSON.stringify(q.say)})'>🔊 Écouter</button>`;if(q.type==='choice')html+='<div class="options">'+q.options.map((o,i)=>`<button class="option" onclick="choose(${i})">${escapeHtml(o)}</button>`).join('')+'</div>';if(q.type==='order'){order=[];html+=`<div id="orderResult" style="min-height:60px"></div><div id="orderWords">${q.words.map((w,i)=>`<button class="word" onclick="pickWord(${i})" id="w${i}">${escapeHtml(w)}</button>`).join('')}</div><button class="btn" onclick="checkOrder()">Vérifier</button>`}if(q.type==='match'){matched=[];matchSelected=null;html+=`<p class="small">Choisis un mot à gauche puis sa traduction à droite.</p><div class="matchcol"><div>${q.pairs.map((x,i)=>`<button class="option" id="left${i}" onclick="match('left',${i})">${escapeHtml(x[0])}</button>`).join('')}</div><div>${[...q.pairs].reverse().map((x,i)=>`<button class="option" id="right${i}" onclick="match('right',${i})">${escapeHtml(x[1])}</button>`).join('')}</div></div>`}html+='</div><div id="feedback"></div>';$('exercise').innerHTML=html}
function result(ok,correct){if(ok)score++;else state.hearts=Math.max(0,state.hearts-1);save();$('feedback').innerHTML=`<div class="feedback ${ok?'success':'danger'}">${ok?'✓ Bonne réponse !':'✗ Pas tout à fait.'}${correct?' Réponse : '+escapeHtml(correct):''}</div><button class="btn" onclick="next()">Continuer →</button>`;document.querySelectorAll('.option,.word').forEach(b=>b.disabled=true)}function next(){step++;renderQuestion()}function choose(i){let q=exerciseData[current][step];let ok=q.options[i]===q.answer;document.querySelectorAll('.option')[i].classList.add(ok?'correct':'wrong');result(ok,ok?'':q.answer)}function pickWord(i){let el=$('w'+i);if(el.disabled)return;el.disabled=true;order.push({i,w:el.textContent});$('orderResult').innerHTML=order.map(x=>`<button class="word selected" onclick="undoWord(${x.i})">${escapeHtml(x.w)}</button>`).join(' ')}function undoWord(i){order=order.filter(x=>x.i!==i);$('w'+i).disabled=false;$('orderResult').innerHTML=order.map(x=>`<button class="word selected" onclick="undoWord(${x.i})">${escapeHtml(x.w)}</button>`).join(' ')}function checkOrder(){let q=exerciseData[current][step];result(order.map(x=>x.w).join(' ')===q.answer.join(' '),q.answer.join(' '))}function match(side,i){let q=exerciseData[current][step],idx=side==='left'?i:q.pairs.length-1-i;if(matched.includes(idx))return;if(!matchSelected){matchSelected={side,idx,i};$(side+i).classList.add('selected');return}if(matchSelected.side===side){$(matchSelected.side+matchSelected.i).classList.remove('selected');matchSelected={side,idx,i};$(side+i).classList.add('selected');return}let ok=matchSelected.idx===idx;$(matchSelected.side+matchSelected.i).classList.remove('selected');if(ok){matched.push(idx);$(side+i).classList.add('correct');$(matchSelected.side+matchSelected.i).classList.add('correct');$(side+i).disabled=true;$(matchSelected.side+matchSelected.i).disabled=true}matchSelected=null;if(matched.length===q.pairs.length)result(true);else if(!ok)$('feedback').innerHTML='<div class="feedback danger">Essaie une autre association.</div>'}
function finish(){let total=exerciseData[current].length;let earned=score*5;state.xp+=earned;if(!state.completed.includes(current))state.completed.push(current);let today=new Date().toLocaleDateString('en-CA');if(state.lastDay!==today){let yesterday=new Date(Date.now()-86400000).toLocaleDateString('en-CA');state.streak=state.lastDay===yesterday?state.streak+1:1;state.lastDay=today}save();$('exercise').innerHTML=`<div class="card" style="text-align:center;margin-top:45px"><div style="font-size:64px">🎉</div><h2>Leçon terminée !</h2><p><strong>+${earned} XP</strong></p><p>${score} / ${total} exercices réussis</p><button class="btn" onclick="tab('courses')">Retour au parcours</button></div>`}
Promise.all([fetch('./curriculum.json').then(r=>{if(!r.ok)throw Error('curriculum');return r.json()}),fetch('./exercises.json').then(r=>{if(!r.ok)throw Error('exercises');return r.json()})]).then(([c,e])=>{curriculum=c;exerciseData=e;updateStats();tab('home')}).catch(()=>{$('home').innerHTML='<div class="card"><h2>Fichiers manquants</h2><p>Publie index.html, curriculum.json et exercises.json dans le même dossier GitHub. Ouvre ensuite le site via GitHub Pages.</p></div>'});
</script></body></html>
