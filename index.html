<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8fafc"><title>LëtzLearn — Apprends le luxembourgeois</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--ink:#23304a;--muted:#8190a5;--blue:#496df6;--mint:#23b9a0;--bg:#f6f8fd;--line:#e8ecf5;--gold:#ffba42}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:540px;margin:auto;min-height:100dvh;padding-bottom:92px}.top{background:#fff;padding:24px 22px 18px;border-bottom:1px solid var(--line)}.toprow{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:27px;letter-spacing:-1px}.logo span{color:var(--blue)}.fox{font-size:36px}.stats{display:flex;gap:8px;margin-top:18px}.pill{background:#f3f6ff;border-radius:16px;padding:10px 12px;font-size:13px;font-weight:800;flex:1;text-align:center}.pill b{font-size:16px}.main{padding:22px 18px}.eyebrow{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:1px}.heading{font-size:27px;font-weight:900;margin:5px 0 17px;letter-spacing:-.7px}.hero{background:linear-gradient(120deg,#526ff9,#8d7bff);color:white;border-radius:25px;padding:24px;position:relative;overflow:hidden;box-shadow:0 9px 24px #526ff929}.hero h2{font-size:26px;margin:0 0 8px}.hero p{max-width:70%;font-size:14px;line-height:1.5;opacity:.95}.hero .character{position:absolute;right:14px;bottom:23px;font-size:80px;filter:drop-shadow(0 5px 4px #0002)}.btn{border:0;background:var(--blue);color:#fff;border-radius:15px;padding:15px 19px;font-weight:900;width:100%;box-shadow:0 4px 0 #304cc0}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #304cc0}.btn.white{background:#fff;color:var(--blue);width:auto;box-shadow:none;margin-top:9px}.btn.ghost{background:#edf1ff;color:var(--blue);box-shadow:none}.btn.green{background:var(--mint);box-shadow:0 4px 0 #14947e}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 12px}.sectionhead h3{margin:0;font-size:19px}.link{border:0;background:none;color:var(--blue);font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}.item{display:flex;gap:14px;align-items:center}.bubble{width:48px;height:48px;border-radius:16px;background:#eef1ff;display:grid;place-items:center;font-size:24px;flex-shrink:0}.grow{flex:1}.item h4{margin:0 0 5px;font-size:16px}.item p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.tag{font-size:11px;font-weight:900;color:var(--blue);background:#eef1ff;padding:7px 9px;border-radius:9px}.progress{height:9px;background:#eef1f6;border-radius:30px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--mint);border-radius:30px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:540px;width:100%;background:#fff;border-top:1px solid var(--line);display:flex;padding:10px 5px max(10px,env(safe-area-inset-bottom));z-index:10}.nav button{flex:1;background:none;border:0;color:#a2aec0;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:5px}.nav button.active{color:var(--blue)}.nav .ico{font-size:23px}.choices{display:grid;gap:11px;margin:20px 0}.choice{border:2px solid var(--line);border-radius:16px;background:#fff;text-align:left;padding:17px;font-weight:800;color:var(--ink);min-height:57px}.choice.selected{border-color:var(--blue);background:#eef1ff}.choice.correct{border-color:var(--mint);background:#e9fbf5}.choice.wrong{border-color:#f26b78;background:#fff0f1}.lessonbar{display:flex;align-items:center;gap:12px;margin-bottom:26px}.lessonbar button{border:0;background:none;font-size:23px;color:var(--muted)}.lessonbar .progress{flex:1;margin:0}.prompt{font-size:24px;font-weight:900;line-height:1.3;margin:12px 0}.quote{border-radius:18px;background:#fff;padding:21px;border:1px solid var(--line);font-size:22px;font-weight:800;text-align:center;margin-top:17px}.feedback{border-radius:15px;padding:14px;font-weight:800;margin:15px 0}.feedback.ok{background:#e9fbf5;color:#11866f}.feedback.no{background:#fff0f1;color:#c34250}.wordbank{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.wordbank button{border:2px solid #e3e8f2;border-radius:12px;background:white;padding:12px 14px;font-weight:800;color:var(--ink)}.wordbank button:disabled{opacity:.3}.answer{min-height:60px;border-bottom:2px dashed #cdd5e2;padding:10px 0;display:flex;flex-wrap:wrap;gap:8px}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.pairs button{background:#fff;border:2px solid var(--line);border-radius:13px;padding:15px 7px;min-height:65px;font-weight:800;color:var(--ink)}.pairs button.selected{border-color:var(--blue);background:#eef1ff}.pairs button.matched{background:#e7f9f3;border-color:var(--mint);color:#16836d}.toggle{display:flex;justify-content:space-between;align-items:center}.toggle input{accent-color:var(--blue);width:21px;height:21px}.hide{display:none!important}.small{font-size:13px;color:var(--muted);line-height:1.55}.price{font-size:34px;font-weight:900}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.kpi{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpi .card{margin:0;text-align:center}.kpi b{display:block;font-size:27px;color:var(--blue)}.premium{background:linear-gradient(120deg,#191f48,#624ec8);color:#fff;border-radius:24px;padding:23px}.premium p{opacity:.85;line-height:1.5}.course{cursor:pointer}.badge{background:#fff3d9;color:#a56b00;border-radius:10px;padding:7px 10px;font-weight:900;font-size:11px}.notice{font-size:12px;background:#fff7e7;padding:12px;border-radius:12px;color:#825b13;line-height:1.5}
</style></head><body><div class="app"><header class="top"><div class="toprow"><div class="logo">Lëtz<span>Learn</span></div><div class="fox" aria-label="Mascotte renard">🦊</div></div><div class="stats"><div class="pill">🔥 <b id="streak">0</b> jours</div><div class="pill">⚡ <b id="xp">0</b> XP</div><div class="pill">❤️ <b id="hearts">5</b> vies</div></div></header><main class="main" id="main"></main><nav class="nav" id="nav"><button data-tab="home" class="active"><span class="ico">🏠</span>Accueil</button><button data-tab="courses"><span class="ico">🗺️</span>Cours</button><button data-tab="words"><span class="ico">📚</span>Mots</button><button data-tab="stats"><span class="ico">🏆</span>Progrès</button><button data-tab="settings"><span class="ico">⚙️</span>Profil</button></nav></div><script>
const KEY='letzlearn_v2';const defaults={xp:0,hearts:5,streak:0,lastDay:'',completed:[],words:[],sound:true,notifications:false};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaults}};let tab='home',lesson=null,idx=0,selected=null,submitted=false,answer=[],matched=[],pairFirst=null,correctCount=0;const main=document.getElementById('main');const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));updateHeader()};const updateHeader=()=>{['xp','hearts','streak'].forEach(k=>document.getElementById(k).textContent=state[k])};const day=()=>new Date().toLocaleDateString('en-CA');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const courses=[{id:'hello',title:'Moien! — Dire bonjour',level:'A1',icon:'👋',desc:'Saluer, remercier et prendre congé',free:true},{id:'intro',title:'Se présenter',level:'A1',icon:'🙋',desc:'Nom, origine et premières conversations',free:true},{id:'numbers',title:'Nombres et couleurs',level:'A1',icon:'🔢',desc:'Compter et décrire les objets',free:false},{id:'family',title:'Famille et personnes',level:'A1',icon:'👨‍👩‍👧',desc:'Parler de ses proches',free:false},{id:'daily',title:'La vie quotidienne',level:'A1',icon:'☀️',desc:'Décrire ses habitudes',free:false},{id:'food',title:'Au restaurant',level:'A2',icon:'🍽️',desc:'Commander et comprendre un menu',free:false},{id:'travel',title:'Se déplacer',level:'A2',icon:'🚆',desc:'Demander son chemin',free:false},{id:'work',title:'Au travail',level:'B1',icon:'💼',desc:'Échanger dans des situations professionnelles',free:false},{id:'debate',title:'Exprimer son opinion',level:'B2',icon:'💬',desc:'Argumenter et nuancer',free:false}];const lessons={hello:[{type:'intro',word:'Moien',phonetic:'moy-en',meaning:'Bonjour',audio:'Moien'},{type:'choice',q:'Comment dit-on « Merci » ?',opts:['Äddi','Merci','Moien','Jo'],good:1},{type:'choice',q:'Que signifie « Äddi » ?',opts:['Oui','Au revoir','Bonsoir','Pardon'],good:1},{type:'pairs',q:'Associe les mots à leur traduction',pairs:[['Moien','Bonjour'],['Jo','Oui'],['Merci','Merci']]},{type:'order',q:'Reconstitue « Comment vas-tu ? »',words:['dir','Wéi','et','geet','?'],good:['Wéi','geet','et','dir','?']},{type:'listen',q:'Écoute puis choisis la bonne traduction',audio:'Et geet mir gutt',opts:['Je vais bien','Je suis fatigué','Au revoir'],good:0},{type:'choice',q:'Que signifie « Pardon » ?',opts:['S’il vous plaît','Excusez-moi','Bonjour'],good:1}],intro:[{type:'intro',word:'Ech heeschen',phonetic:'èkh hèss-en',meaning:'Je m’appelle',audio:'Ech heeschen'},{type:'choice',q:'Comment dit-on « Je suis » ?',opts:['Ech sinn','Du bass','Mir sinn'],good:0},{type:'pairs',q:'Associe les expressions',pairs:[['Ech','Je'],['Du','Tu'],['Mir','Nous']]},{type:'order',q:'Reconstitue « Je viens de Belgique »',words:['der','Ech','aus','kommen','Belsch'],good:['Ech','kommen','aus','der','Belsch']},{type:'listen',q:'Écoute cette expression',audio:'Ech sinn midd',opts:['Je suis content','Je suis fatigué','J’ai faim'],good:1}]};const button=(s,fn,cls='btn')=>`<button class="${cls}" onclick="${fn}">${s}</button>`;function navigate(t){lesson=null;tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.tab)));function speak(s){if(!state.sound)return; if(!('speechSynthesis'in window)){alert('La synthèse vocale n’est pas disponible sur cet appareil.');return}let u=new SpeechSynthesisUtterance(s);u.lang='lb-LU';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function start(id){let c=courses.find(x=>x.id===id);if(!c.free){navigate('pro');return}lesson=id;idx=0;selected=null;submitted=false;answer=[];matched=[];pairFirst=null;correctCount=0;render()}function render(){updateHeader();if(lesson){renderLesson();return}if(tab==='home'){main.innerHTML=`<div class="eyebrow">Däi Lëtzebuergesch Abenteuer</div><div class="heading">Moien, bienvenue ! 👋</div><section class="hero"><h2>Ton aventure commence ici</h2><p>Apprends le luxembourgeois, une petite victoire à la fois.</p>${button('Commencer →',"start('hello')",'btn white')}<div class="character">🦊</div></section><div class="sectionhead"><h3>Ton parcours</h3><button class="link" onclick="navigate('courses')">Voir tout</button></div>${courseCard(courses[0])}${courseCard(courses[1])}<div class="sectionhead"><h3>À découvrir</h3></div><div class="card item"><div class="bubble">📖</div><div class="grow"><h4>Mon vocabulaire</h4><p>${state.words.length} mots enregistrés à réviser</p></div><button class="link" onclick="navigate('words')">Voir</button></div><div class="card item"><div class="bubble">👑</div><div class="grow"><h4>LëtzLearn Pro</h4><p>Accède à tous les niveaux et entraînements</p></div><button class="link" onclick="navigate('pro')">Découvrir</button></div>`}else if(tab==='courses'){main.innerHTML=`<div class="eyebrow">Apprendre à ton rythme</div><div class="heading">Parcours de cours 🗺️</div><p class="small">Deux premières leçons de démonstration accessibles. Les autres chapitres présentent la structure prévue.</p>${['A1','A2','B1','B2'].map(l=>`<div class="sectionhead"><h3>Niveau ${l}</h3><span class="tag">${courses.filter(c=>c.level===l).length} chapitres</span></div>${courses.filter(c=>c.level===l).map(courseCard).join('')}`).join('')}`}else if(tab==='words'){main.innerHTML=`<div class="eyebrow">Réviser régulièrement</div><div class="heading">Mon vocabulaire 📚</div>${state.words.length?state.words.map(w=>`<div class="card item"><div class="bubble">📖</div><div class="grow"><h4>${esc(w.word)}</h4><p>${esc(w.meaning)}</p></div><button class="link" onclick="speak('${w.word.replace(/'/g,"\\'")}')">🔊</button></div>`).join(''):`<div class="card empty">Aucun mot enregistré. Commence une leçon pour remplir ton carnet !</div>`}${button('Faire une leçon',"start('hello')",'btn ghost')}`}else if(tab==='stats'){main.innerHTML=`<div class="eyebrow">Chaque effort compte</div><div class="heading">Ma progression 🏆</div><div class="kpi"><div class="card">⚡<b>${state.xp}</b><span class="small">XP gagnés</span></div><div class="card">🔥<b>${state.streak}</b><span class="small">Jours de série</span></div><div class="card">📚<b>${state.words.length}</b><span class="small">Mots découverts</span></div><div class="card">🎓<b>${state.completed.length}</b><span class="small">Leçons terminées</span></div></div><div class="sectionhead"><h3>Leçons terminées</h3></div>${state.completed.length?state.completed.map(id=>`<div class="card">✅ ${esc(courses.find(c=>c.id===id)?.title||id)}</div>`).join(''):'<div class="card small">Termine une leçon pour voir tes résultats.</div>'}`}else if(tab==='settings'){main.innerHTML=`<div class="eyebrow">Ton espace personnel</div><div class="heading">Profil et paramètres ⚙️</div><div class="card item"><div class="bubble">🦊</div><div class="grow"><h4>Apprenant LëtzLearn</h4><p>Progression enregistrée sur cet appareil</p></div></div><div class="card toggle"><div><b>🔊 Sons et prononciation</b><p class="small">Synthèse vocale du navigateur</p></div><input type="checkbox" ${state.sound?'checked':''} onchange="state.sound=this.checked;save()"></div><div class="card toggle"><div><b>🔔 Rappels</b><p class="small">Préférence enregistrée ; notifications non activées</p></div><input type="checkbox" ${state.notifications?'checked':''} onchange="state.notifications=this.checked;save()"></div><div class="card item"><div class="bubble">👑</div><div class="grow"><h4>Abonnement Pro</h4><p>Voir les avantages et le statut</p></div><button class="link" onclick="navigate('pro')">Voir</button></div><div class="notice">Cette démonstration ne possède pas encore de connexion utilisateur, de synchronisation cloud ni de paiements. Ne saisis aucune information bancaire ici.</div><div style="margin-top:18px">${button('Réinitialiser ma progression',"resetProgress()",'btn ghost')}</div>`}else if(tab==='pro'){main.innerHTML=`<div class="eyebrow">LëtzLearn Premium</div><div class="heading">Passe à Pro 👑</div><div class="premium"><div style="font-size:45px">🦊✨</div><h2>Le luxembourgeois sans limites</h2><p>Accès aux cours A1–B2 disponibles, entraînements illimités, révisions intelligentes et statistiques avancées.</p><div class="price">6,99 € <span style="font-size:15px;font-weight:500">/ mois</span></div><p style="font-size:12px">Tarif envisagé, non commercialisé à ce stade.</p></div><div class="sectionhead"><h3>Inclus dans Pro</h3></div>${['Tous les parcours disponibles','Exercices et entraînements illimités','Préparation au Sproochentest','Statistiques et révisions personnalisées'].map(s=>`<div class="card">✅ ${s}</div>`).join('')}<div class="notice">Le paiement n’est pas encore activé. Un prestataire de paiement, un serveur sécurisé et la gestion des abonnements seront nécessaires avant de vendre Pro.</div><div style="margin-top:16px">${button('Paiement bientôt disponible', '', 'btn ghost')}</div>`}}
function courseCard(c){let done=state.completed.includes(c.id);return `<div class="card item course" onclick="start('${c.id}')"><div class="bubble">${c.icon}</div><div class="grow"><h4>${esc(c.title)}</h4><p>${esc(c.desc)}</p><div class="progress"><i style="width:${done?100:0}%"></i></div></div><span class="${c.free?'tag':'badge'}">${done?'✓':c.free?'JOUER':'🔒 PRO'}</span></div>`}
function renderLesson(){let ex=lessons[lesson][idx],n=lessons[lesson].length;let head=`<div class="lessonbar"><button onclick="exitLesson()">✕</button><div class="progress"><i style="width:${Math.round(idx/n*100)}%"></i></div><span>❤️ ${state.hearts}</span></div><div class="eyebrow">Exercice ${idx+1} sur ${n}</div>`;let body='';if(ex.type==='intro'){body=`<div class="heading">Découvre un nouveau mot ✨</div><div class="card" style="text-align:center;padding:35px 20px"><div style="font-size:52px">🦊</div><div style="font-size:34px;font-weight:900;margin:15px 0 4px">${esc(ex.word)}</div><p class="small">${esc(ex.phonetic)}</p><button class="choice" onclick="speak(${JSON.stringify(ex.audio).replace(/"/g,'&quot;')})">🔊 Écouter</button><h3>${esc(ex.meaning)}</h3></div>${button('Mot compris →','nextExercise(true)')}`}else if(ex.type==='choice'||ex.type==='listen'){body=`<div class="heading">${ex.type==='listen'?'Écoute et réponds 🎧':'Choisis la réponse 💡'}</div><div class="prompt">${esc(ex.q)}</div>${ex.type==='listen'?`<div class="quote"><button class="choice" onclick="speak(${JSON.stringify(ex.audio).replace(/"/g,'&quot;')})">🔊 Écouter la phrase</button></div>`:''}<div class="choices">${ex.opts.map((o,i)=>`<button class="choice ${selected===i?'selected':''} ${submitted&&i===ex.good?'correct':''} ${submitted&&selected===i&&i!==ex.good?'wrong':''}" onclick="pick(${i})" ${submitted?'disabled':''}>${esc(o)}</button>`).join('')}</div>${submitted?feedback(selected===ex.good,ex.opts[ex.good])+button('Continuer →','nextExercise(false)', 'btn green'):button('Vérifier','checkAnswer()', 'btn')}`}else if(ex.type==='order'){body=`<div class="heading">Remets les mots dans l'ordre 🧩</div><div class="prompt">${esc(ex.q)}</div><div class="answer">${answer.map((w,i)=>`<button class="choice" onclick="removeWord(${i})">${esc(w)} ✕</button>`).join('')}</div><div class="wordbank">${ex.words.map((w,i)=>`<button onclick="addWord(${i})" ${answer.some(a=>a===w)?'disabled':''}>${esc(w)}</button>`).join('')}</div>${submitted?feedback(answer.join(' ')===ex.good.join(' '),ex.good.join(' '))+button('Continuer →','nextExercise(false)','btn green'):button('Vérifier','checkAnswer()')}`}else if(ex.type==='pairs'){let all=[...ex.pairs.map((p,i)=>({text:p[0],id:i,side:'l'})),...ex.pairs.map((p,i)=>({text:p[1],id:i,side:'r'}))];body=`<div class="heading">Trouve les paires 🔗</div><div class="prompt">${esc(ex.q)}</div><div class="pairs">${all.map((p,i)=>`<button class="${matched.includes(i)?'matched':pairFirst===i?'selected':''}" ${matched.includes(i)?'disabled':''} onclick="pairPick(${i})">${esc(p.text)}</button>`).join('')}</div><p class="small">Sélectionne un mot dans chaque langue.</p>${matched.length===all.length?`<div class="feedback ok">Bravo ! Toutes les paires sont trouvées.</div>${button('Continuer →','nextExercise(true)','btn green')}`:''}`}main.innerHTML=head+body}
function feedback(ok,good){return `<div class="feedback ${ok?'ok':'no'}">${ok?'✅ Bien joué !':'💡 Bonne réponse : '+esc(good)}</div>`}function pick(i){if(!submitted){selected=i;renderLesson()}}function addWord(i){if(!submitted){answer.push(lessons[lesson][idx].words[i]);renderLesson()}}function removeWord(i){if(!submitted){answer.splice(i,1);renderLesson()}}function checkAnswer(){let ex=lessons[lesson][idx];if(ex.type==='choice'||ex.type==='listen'){if(selected===null)return;submitted=true;let ok=selected===ex.good;if(ok)correctCount++;else state.hearts=Math.max(0,state.hearts-1)}else if(ex.type==='order'){if(!answer.length)return;submitted=true;let ok=answer.join(' ')===ex.good.join(' ');if(ok)correctCount++;else state.hearts=Math.max(0,state.hearts-1)}save();renderLesson()}function pairPick(i){if(matched.includes(i))return;let ex=lessons[lesson][idx];let n=ex.pairs.length;if(pairFirst===null){pairFirst=i;renderLesson();return}if((i<n)===(pairFirst<n)){pairFirst=i;renderLesson();return}if(i%n===pairFirst%n){matched.push(i,pairFirst);if(matched.length===n*2)correctCount++}pairFirst=null;renderLesson()}function nextExercise(ok){let ex=lessons[lesson][idx];if(ex.type==='intro'){if(!state.words.some(w=>w.word===ex.word))state.words.push({word:ex.word,meaning:ex.meaning});correctCount++}idx++;selected=null;submitted=false;answer=[];matched=[];pairFirst=null;save();if(idx>=lessons[lesson].length){finishLesson()}else renderLesson()}function finishLesson(){let id=lesson,total=lessons[id].length;state.xp+=Math.round(correctCount/total*70);if(!state.completed.includes(id))state.completed.push(id);let today=day();if(state.lastDay!==today){let yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);let y=yesterday.toLocaleDateString('en-CA');state.streak=state.lastDay===y?state.streak+1:1;state.lastDay=today}state.hearts=5;save();lesson=null;main.innerHTML=`<div class="card" style="text-align:center;padding:35px 22px"><div style="font-size:75px">🎉🦊</div><h1>Leçon terminée !</h1><p class="small">Tu progresses en luxembourgeois !</p><div class="kpi"><div class="card">⚡<b>+${Math.round(correctCount/total*70)}</b>XP</div><div class="card">🎯<b>${Math.round(correctCount/total*100)} %</b>Réussite</div></div><div style="margin-top:24px">${button('Continuer',"navigate('courses')")}</div></div>`}function exitLesson(){if(confirm('Quitter la leçon ? La progression de cette leçon ne sera pas conservée.'))navigate('courses')}function resetProgress(){if(confirm('Effacer toute la progression enregistrée sur cet appareil ?')){state={...defaults};save();render()}}updateHeader();render();
</script></body></html>
