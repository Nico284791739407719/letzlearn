// Révision adaptative : insère des mots des leçons déjà terminées, avec priorité aux erreurs.
function reviewId(q){return q[3]+'|'+q[1].normalize('NFC')}
function buildSession(i){

 for(let j=0;j<i;j++)for(const q of lessons[j].q){const id=reviewId(q);if(!seen.has(id)){seen.add(id);pool.push(q)}}

}

let luxEngine=null,luxPending=null,luxVoice='mia';
async function speakLux(text,slow=false){

function speak(text,lang='lb',slow=false){

function spokenAnswer(q){

}
