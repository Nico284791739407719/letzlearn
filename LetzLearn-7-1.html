let rhEngine=null,rhPromise=null,audioUnlocked=false;
function unlockVoice(){audioUnlocked=true;try{if(rhEngine)rhEngine.unlock()}catch(e){}}
function prepareVoice(){if(!rhPromise)rhPromise=import('https://accessibility-luxembourg.github.io/rhvoice-emscripten-lb/src/rhvoice-tts.js').then(async m=>{await m.init();rhEngine=m;return m}).catch(e=>{rhPromise=null;throw e});return rhPromise}
function speakId(id){speak(lex[id].lb)}
async function speak(text){unlockVoice();const n=$('voiceNotice');if(n)n.textContent='🎧 Chargement de la voix luxembourgeoise…';try{const engine=await prepareVoice();engine.unlock();await engine.speak(text,'mia',{rate:.90,pitch:1,volume:1});if(n)n.textContent=''}catch(e){if(n)n.textContent='🔇 Impossible de charger Mia. Vérifie ta connexion Internet puis réessaie.';console.warn('Voix Mia',e)}}

function path(){const available=worlds.filter(w=>w.level===level);root.innerHTML=`<div class="page"><div class="hero"><div><h1>Ton aventure commence ici !</h1><p>Découvre le Luxembourg, une mission à la fois. 🏰</p></div><div class="fox" aria-label="Renard">🦊</div></div><h2>Les quatre régions</h2><div class="tabs">${['A1','A2','B1','B2'].map(x=>`<button class="${level===x?'active':''}" onclick="chooseLevel('${x}')">${x}</button>`).join('')}</div><div class="row"><b>${level} · ${available.length} mondes</b><span class="smallnote">15 missions prévues / monde</span></div>${available.map((w,i)=>{const ready=w.index===0||w.index===1;return `<div class="world ${ready?'':'locked'}" onclick="openWorld(${w.index})"><div class="world-icon">${icons[w.index%icons.length]}</div><div><span class="tag">${w.level} · MONDE ${i+1}</span><strong>${esc(w.name)}</strong><small>${ready?'Démonstration jouable · 3 missions':'Programme prévu · contenu à développer'}</small></div><b style="margin-left:auto">${ready?'▶':'🔒'}</b></div>`}).join('')}<p class="smallnote">Le parcours complet A1–B2 est planifié : 56 mondes et 840 missions. Seuls les deux premiers mondes disposent pour l’instant de missions jouables. Les niveaux B1/B2 ne sont pas encore des cours complets.</p></div>`}
function chooseLevel(l){level=l;path()}function openWorld(i){if(i>1){alert('Ce monde figure dans le programme, mais ses missions ne sont pas encore développées.');return}const w=worlds[i];root.innerHTML=`<div class="page"><button class="secondary" onclick="path()">← Retour aux mondes</button><div class="scene">${i?'☕ 🦊 🥐':'🏘️ 🦊 👋'}</div><h1>${esc(w.name)}</h1><p class="muted">Trois missions courtes, avec des exercices variés et des révisions des acquis précédents.</p>${[0,1,2].map((m)=>`<div class="world" onclick="start(${i},${m})"><div class="world-icon">${['🎯','🎭','🏆'][m]}</div><div><strong>${['Découvrir','Mettre en pratique','Défi final'][m]}</strong><small>8 exercices · voix après validation</small></div><b>▶</b></div>`).join('')}</div>`}
function review(){let missed=lex.filter(x=>(data.attempts[x.id]?.wrong||0)>0),seen=lex.filter(x=>(data.attempts[x.id]?.right||0)>0);root.innerHTML=`<div class="page"><h1>🧠 Ton entraînement</h1><p class="muted">Les mots difficiles reviennent régulièrement, même lorsque tu avances vers un nouveau niveau.</p><div class="grid"><div class="metric"><strong>${seen.length}</strong>Mots pratiqués</div><div class="metric"><strong>${missed.length}</strong>À renforcer</div></div><div class="mission"><h2>Révision personnalisée</h2><p>Exercices de compréhension, association, construction et écoute à partir de tes erreurs et acquis.</p><button class="big" onclick="start(0,0,true)">RÉVISER MAINTENANT</button></div><h2>Les mots à revoir</h2>${(missed.length?missed:lex.slice(0,5)).slice(0,12).map(x=>`<div class="world"><div class="world-icon">${x.emoji}</div><div><strong>${esc(x.lb)}</strong><small>${esc(x.fr)}</small></div><button class="secondary" onclick="speakId(${x.id})">🔊</button></div>`).join('')}</div>`}
function quests(){root.innerHTML=`<div class="page"><h1>🎁 Défis et récompenses</h1><div class="hero"><div><h2>Une petite victoire chaque jour</h2><p>Gagne des XP et construis ton aventure.</p></div><div class="fox">🦊</div></div>${[['⭐','Gagner 100 XP',data.xp,100],['🧠','Pratiquer 10 mots',Object.keys(data.attempts).length,10],['🏆','Terminer 3 missions',data.completed.length,3]].map(([icon,name,n,target])=>`<div class="world"><div class="world-icon">${icon}</div><div><strong>${name}</strong><small>${Math.min(n,target)} / ${target}</small></div></div>`).join('')}</div>`}
function profile(){root.innerHTML=`<div class="page"><div class="hero"><div><h1>Ton profil d'aventurier</h1><p>Chaque mission te rapproche de la prochaine conversation.</p></div><div class="fox">🦊</div></div><div class="grid" style="margin-top:20px"><div class="metric"><strong>${data.xp}</strong>XP</div><div class="metric"><strong>${data.streak}</strong>Jours de série</div><div class="metric"><strong>${data.completed.length}</strong>Missions terminées</div><div class="metric"><strong>${Object.keys(data.attempts).length}</strong>Mots travaillés</div></div><div class="card"><h2>⚙️ Préférences</h2><label><input type="checkbox" ${data.sound?'checked':''} onchange="data.sound=this.checked;save()"> Effets sonores</label><p class="muted">Prononciation : voix luxembourgeoise Mia (RHVoice), chargée en ligne. Nécessite une connexion Internet. Appuie sur 🔊 pour tester.</p><p id="voiceNotice" class="smallnote"></p></div></div>`}

if(learn){root.innerHTML=`<div class="page"><div class="lessonhead"><button onclick="quit()">×</button><div class="progress"><div style="width:${i/6*100}%"></div></div><b>🦊</b></div><div class="scene" style="font-size:75px;animation:float 2s ease-in-out infinite">${c.emoji} 🦊</div><p class="muted">DÉCOUVERTE ${i+1}/3 · PAS DE PIÈGE</p><h1>${esc(c.story)}</h1><div class="card" style="text-align:center"><p>${esc(c.fr)}</p><h1 style="font-size:40px;color:#20975d">${esc(c.lb)}</h1><button class="secondary" onclick="speak('${c.lb.replace(/'/g,"\\'")}')">🔊 ÉCOUTER EN LUXEMBOURGEOIS</button><p id="voiceNotice" class="smallnote"></p></div><p class="muted">${esc(c.task)}</p><button class="big" onclick="introStep(${i+1})">J'AI COMPRIS →</button></div>`}
else{const idx=i-3,c=introCards[idx],choices=idx===0?['Äddi','Moien','Nee']:idx===1?['Merci','Jo','Moien']:['Merci','Äddi','Jo'];root.innerHTML=`<div class="page"><div class="lessonhead"><button onclick="quit()">×</button><div class="progress"><div style="width:${i/6*100}%"></div></div><b>💛</b></div><p class="muted">À TON TOUR · ${idx+1}/3</p><div class="scene" style="font-size:70px">🦊 ${c.emoji}</div><h1>Comment dit-on « ${esc(c.fr)} » ?</h1><p class="muted">Tu viens de l'apprendre. Choisis la bonne réponse !</p><div class="choices">${choices.map(x=>`<button class="choice" onclick="introSelect(this,'${x}')">${x}</button>`).join('')}</div><div id="feedback"></div><button id="check" class="big" disabled onclick="introValidate()">VÉRIFIER</button><p id="voiceNotice" class="smallnote"></p></div>`}}
function introSelect(b,v){if(introPick==='done')return;introPick=v;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('check').disabled=false;fx('tap')}
function introValidate(){const i=introIndex,c=introCards[i-3];if(introPick==='done'){introStep(i+1);return}if(introPick===c.lb){fx('yes');burst(16);$('feedback').innerHTML=`<div class="feedback good">✨ Bravo ! ${esc(c.lb)} veut dire ${esc(c.fr)}.</div>`;speak(c.lb)}else{fx('no');$('feedback').innerHTML=`<div class="feedback bad">💛 Pas grave ! La bonne réponse est ${esc(c.lb)}. Réécoutons-la.</div>`;speak(c.lb)}introPick='done';$('check').textContent='CONTINUER';$('check').disabled=false}
function start(w,m,rev=false){if(w===0&&m===0&&!rev&&!data.completed.includes('0-0')){introStep(0);return}const base=w===0?lex.slice(0,9):lex.slice(8,17);const old=lex.slice(0,9);let pool=rev?lex.filter(x=>(data.attempts[x.id]?.wrong||0)>0):base;if(pool.length<4)pool=rev?lex.slice(0,12):base;const mixed=rev?mix(pool):mix([...base,...mix(old).slice(0,3)]);const types=['choice','scene','build','reverse','pairs','choice','listen','build'];const qs=types.map((type,i)=>{const word=mixed[i%mixed.length];return {type,word}});session={w,m,rev,qs,index:0,correct:0,hearts:5,combo:0,xp:0};selected=null;answered=false;render()}
function options(word,field){let arr=[word[field]];for(const x of mix(lex.filter(x=>x.id!==word.id))){if(!arr.includes(x[field]))arr.push(x[field]);if(arr.length===4)break}return mix(arr)}
function renderQuestion(){let s=session,q=s.qs[s.index],w=q.word;selected=null;answered=false;sequence=[];pairFound=[];pairSelected=null;let html=`<div class="page"><div class="lessonhead"><button onclick="quit()">×</button><div class="progress"><div style="width:${s.index/s.qs.length*100}%"></div></div><b>❤️ ${s.hearts}</b></div><p class="muted">${['TRADUCTION','DIALOGUE','CONSTRUCTION','COMPRÉHENSION','ASSOCIATIONS','TRADUCTION','ÉCOUTE','CONSTRUCTION'][s.index]} · ${s.index+1}/${s.qs.length}</p>`;
if(q.type==='choice'||q.type==='scene'){html+=q.type==='scene'?`<div class="character"><div class="face">🦊</div><div class="bubble">Aide-moi à dire « ${esc(w.fr)} » !</div></div>`:`<h1>Comment dit-on « ${esc(w.fr)} » ?</h1>`;html+=`<div class="choices">${options(w,'lb').map(v=>`<button class="choice" data-v="${esc(v)}" onclick="pick(this)">${esc(v)}</button>`).join('')}</div>`}
if(q.type==='reverse'){html+=`<h1>Que signifie « ${esc(w.lb)} » ?</h1><div class="choices">${options(w,'fr').map(v=>`<button class="choice" data-v="${esc(v)}" onclick="pick(this)">${esc(v)}</button>`).join('')}</div>`}
if(q.type==='listen'){html+=`<h1>Écoute et trouve la traduction</h1><div class="scene"><button class="secondary" onclick="speakId(${w.id})">🔊 ÉCOUTER</button></div><p id="voiceNotice" class="smallnote"></p><div class="choices">${options(w,'fr').map(v=>`<button class="choice" data-v="${esc(v)}" onclick="pick(this)">${esc(v)}</button>`).join('')}</div>`}
if(q.type==='build'){const words=w.lb.split(' '),distractors=mix(lex.flatMap(x=>x.lb.split(' ')).filter(x=>!words.includes(x)&&x.length>2)).slice(0,3);const bank=mix([...words,...distractors]);html+=`<h1>Construis : « ${esc(w.fr)} »</h1><div class="answer" id="answer"></div><div class="bank">${bank.map((v,i)=>`<button class="tile" id="tile${i}" onclick="addWord(${i})">${esc(v)}</button>`).join('')}</div>`}
if(q.type==='pairs'){let words=mix([w,...mix(lex.filter(x=>x.id!==w.id)).slice(0,3)]);s.pairs=words;html+=`<h1>Associe les mots</h1><div class="choices">${mix(words.flatMap(x=>[{id:x.id,v:x.fr},{id:x.id,v:x.lb}])).map((x,i)=>`<button class="choice" data-pair="${x.id}" onclick="pair(this)">${esc(x.v)}</button>`).join('')}</div>`}
html+=`<div id="feedback"></div><button id="check" class="big" disabled onclick="check()">VÉRIFIER</button></div>`;root.innerHTML=html}
function pick(b){if(answered)return;document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b.dataset.v;$('check').disabled=false;fx('tap')}
function addWord(i){if(answered)return;const b=$('tile'+i);if(b.disabled)return;b.disabled=true;sequence.push({i,v:b.textContent});$('answer').innerHTML=sequence.map((x,j)=>`<button class="tile" onclick="removeWord(${j})">${esc(x.v)}</button>`).join('');$('check').disabled=!sequence.length}
function removeWord(j){const x=sequence.splice(j,1)[0];$('tile'+x.i).disabled=false;$('answer').innerHTML=sequence.map((x,k)=>`<button class="tile" onclick="removeWord(${k})">${esc(x.v)}</button>`).join('');$('check').disabled=!sequence.length}
function pair(b){if(answered||b.disabled)return;if(!pairSelected){pairSelected=b;b.classList.add('sel');return}if(pairSelected===b){b.classList.remove('sel');pairSelected=null;return}if(pairSelected.dataset.pair===b.dataset.pair){b.disabled=true;pairSelected.disabled=true;b.classList.add('good');pairSelected.classList.add('good');pairFound.push(b.dataset.pair);fx('yes');if(pairFound.length===4){selected='pairs';$('check').disabled=false}}else{fx('no');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),350)}pairSelected.classList.remove('sel');pairSelected=null}
function check(){const s=session,q=s.qs[s.index],w=q.word;if(answered){if(s.index===s.qs.length-1||s.hearts===0)finish();else{s.index++;renderQuestion()}return}const expected=['choice','scene'].includes(q.type)?w.lb:['reverse','listen'].includes(q.type)?w.fr:q.type==='build'?w.lb:'pairs';const actual=q.type==='build'?sequence.map(x=>x.v).join(' '):selected;const good=actual===expected;answered=true;const a=data.attempts[w.id]||{right:0,wrong:0};a[good?'right':'wrong']++;data.attempts[w.id]=a;if(good){s.correct++;s.combo++;const bonus=10+(s.combo>=3?5:0);s.xp+=bonus;fx('yes');burst(s.combo>=3?24:12);$('feedback').innerHTML=`<div class="feedback good">✨ Bravo ! +${bonus} XP ${s.combo>=3?'🔥 Combo ×'+s.combo:''}<div class="smallnote">${esc(w.lb)}</div></div>`}else{s.hearts--;s.combo=0;fx('no');$('feedback').innerHTML=`<div class="feedback bad">💛 On apprend de ses erreurs !<div class="smallnote">Bonne réponse : ${esc(expected)}</div></div>`}if(q.type!=='pairs')document.querySelectorAll('[data-v]').forEach(b=>{if(b.dataset.v===expected)b.classList.add('good');else if(b.classList.contains('sel'))b.classList.add('bad')});$('feedback').innerHTML+=`<button class="secondary" style="margin-top:10px" onclick="speakId(${w.id})">🔊 Réécouter : ${esc(w.lb)}</button><p id="voiceNotice" class="smallnote"></p>`;$('check').textContent=s.index===s.qs.length-1||s.hearts===0?'VOIR MA RÉCOMPENSE':'CONTINUER';$('check').disabled=false;save();if(q.type!=='listen')setTimeout(()=>speak(w.lb),320)}
function finish(){const s=session;data.xp+=s.xp;const id=`${s.w}-${s.m}`;if(!s.rev&&!data.completed.includes(id))data.completed.push(id);const today=new Date().toLocaleDateString('sv-SE');if(data.last!==today){const y=new Date();y.setDate(y.getDate()-1);data.streak=data.last===y.toLocaleDateString('sv-SE')?data.streak+1:1;data.last=today}save();session=null;head();root.innerHTML=`<div class="page reward"><div class="fox happy">🦊</div><h1>MISSION ACCOMPLIE !</h1><p>Tu as gagné</p><div class="xp">+${s.xp} XP</div><h2>${s.correct} / ${s.qs.length} bonnes réponses</h2><p>🌟 ${data.streak} jour(s) de série</p><button class="big" onclick="navigate('path')">CONTINUER L'AVENTURE</button><button class="secondary" style="margin-top:14px;width:100%" onclick="navigate('review')">RÉVISER MES MOTS</button></div>`;burst(55);fx('yes')}
function quit(){session=null;navigate('path')}render();</script></body></html>
