const avatarChoices=[['a0','Léo'],['a1','Emma'],['a2','Noah'],['a3','Lina'],['a4','Hugo'],['a5','Mila'],['a6','Adam'],['a7','Chloé']];
function myAvatar(){return avatarChoices.some(a=>a[0]===data.avatar)?data.avatar:'a0'}
function avatarPicture(a){return `<img class="character-art" src="${avatarArt[a]||avatarArt.a0}" alt="Avatar illustré">`}
function chooseAvatar(a){if(!avatarChoices.some(x=>x[0]===a))return;data.avatar=a;save();fx('yes');profile()}
function avatarPicker(){root.innerHTML=`<div class="page"><button class="secondary" onclick="profile()">← Mon profil</button><h1>Choisis ton aventurier</h1><p class="muted">Huit personnages illustrés. Ton choix reste associé à ton profil.</p><div class="avatar-grid">${avatarChoices.map(([id,name])=>`<button class="avatar-option ${myAvatar()===id?'picked':''}" onclick="chooseAvatar('${id}')">${avatarPicture(id)}<small>${name}</small>${myAvatar()===id?'<b>✓ Sélectionné</b>':''}</button>`).join('')}</div></div>`}

const icons=['👋','☕','🥖','🛍️','🚆','🤝','🏠','🧺','🍽️','💬','🌦️','🎨','🏰','📅','🚴','🩺','💼','🚉','🎉','📷','🌲','🧭','🗣️','🎤','🌍','📜','⚖️','🏆'];function head(){ $('xp').textContent='⭐ '+data.xp;$('streak').textContent='🔥 '+data.streak;const tabs=[['path','Parcours'],['review','Réviser'],['quests','Défis'],['profile','Profil']];const navIcons={"path": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z\"/><path d=\"M9 3v15M15 6v15\"/></svg>", "review": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z\"/><path d=\"M4 5.5V21m4-13h8m-8 4h6\"/></svg>", "quests": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"8\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M12 8v13M3 12h18M12 8C5 8 6 2 9 2c2 0 3 3 3 6Zm0 0c7 0 6-6 3-6-2 0-3 3-3 6Z\"/></svg>", "profile": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21a8 8 0 0 1 16 0\"/></svg>"};$('nav').style.display=session?'none':'flex';$('nav').innerHTML=tabs.map(([id,label])=>`<button type="button" aria-label="${label}" aria-current="${tab===id?'page':'false'}" class="${tab===id?'active':''}" onclick="navigate('${id}')"><span class="nav-icon">${navIcons[id]}</span><span class="nav-label">${label}</span></button>`).join('')}
function navigate(t){session=null;tab=t;head();render()}function render(){head();if(session)return renderQuestion();if(tab==='path')return path();if(tab==='review')return review();if(tab==='quests')return quests();return profile()}
function path(){const available=worlds.filter(w=>w.level===level);root.innerHTML=`<div class="page"><div class="visual-banner" style="background-image:url(${visualArt.map})"><div class="banner-shade"><span class="banner-pill">✦ L’AVENTURE CONTINUE</span><h1>Ton aventure commence ici !</h1><p>Découvre le Luxembourg, une mission à la fois. 🏰</p></div></div><h2>Les quatre régions</h2><div class="tabs">${['A1','A2','B1','B2'].map(x=>`<button class="${level===x?'active':''}" onclick="chooseLevel('${x}')">${x}</button>`).join('')}</div><div class="row"><b>${level} · ${available.length} mondes</b><span class="smallnote">3 missions par monde A1 · autres niveaux en préparation</span></div>${available.map((w,i)=>{const ready=w.index===0||w.index===1;return `<div class="world ${ready?'':'locked'}" onclick="openWorld(${w.index})"><div class="world-icon">${icons[w.index%icons.length]}</div><div><span class="tag">${w.level} · MONDE ${i+1}</span><strong>${esc(w.name)}</strong><small>${ready?'Démonstration jouable · 3 missions':'Programme prévu · contenu à développer'}</small></div><b style="margin-left:auto">${ready?'▶':'🔒'}</b></div>`}).join('')}<p class="smallnote">Le parcours complet A1–B2 est planifié : 56 mondes et 840 missions. Seuls les deux premiers mondes disposent pour l’instant de missions jouables. Les niveaux B1/B2 ne sont pas encore des cours complets.</p></div>`}
function chooseLevel(l){level=l;path()}function openWorld(i){if(i>1){alert('Ce monde figure dans le programme, mais ses missions ne sont pas encore développées.');return}const w=worlds[i];root.innerHTML=`<div class="page"><button class="secondary" onclick="path()">← Retour aux mondes</button><div class="scene game-scene" style="background-image:url(${i?visualArt.lesson:visualArt.fox})">${i?'☕ 🦊 🥐':'🏘️ 🦊 👋'}</div><h1>${esc(w.name)}</h1><p class="muted">Trois missions courtes, avec des exercices variés et des révisions des acquis précédents.</p>${[0,1,2].map((m)=>`<div class="world" onclick="start(${i},${m})"><div class="world-icon">${['🎯','🎭','🏆'][m]}</div><div><strong>${['Découvrir','Mettre en pratique','Défi final'][m]}</strong><small>8 exercices · voix après validation</small></div><b>▶</b></div>`).join('')}</div>`}
function review(){let missed=lex.filter(x=>(data.attempts[x.id]?.wrong||0)>0),seen=lex.filter(x=>(data.attempts[x.id]?.right||0)>0);root.innerHTML=`<div class="page"><h1>🧠 Ton entraînement</h1><p class="muted">Les mots difficiles reviennent régulièrement, même lorsque tu avances vers un nouveau niveau.</p><div class="grid"><div class="metric"><strong>${seen.length}</strong>Mots pratiqués</div><div class="metric"><strong>${missed.length}</strong>À renforcer</div></div><div class="mission"><h2>Révision personnalisée</h2><p>Exercices de compréhension, association, construction et écoute à partir de tes erreurs et acquis.</p><button class="big" onclick="start(0,0,true)">RÉVISER MAINTENANT</button></div><h2>Les mots à revoir</h2>${(missed.length?missed:lex.slice(0,5)).slice(0,12).map(x=>`<div class="world"><div class="world-icon">${x.emoji}</div><div><strong>${esc(x.lb)}</strong><small>${esc(x.fr)}</small></div><button class="secondary" onclick="speakId(${x.id})">🔊</button></div>`).join('')}</div>`}
function quests(){root.innerHTML=`<div class="page"><h1>🎁 Défis et récompenses</h1><div class="hero"><div><h2>Une petite victoire chaque jour</h2><p>Gagne des XP et construis ton aventure.</p></div><div class="fox">🦊</div></div>${[['⭐','Gagner 100 XP',data.xp,100],['🧠','Pratiquer 10 mots',Object.keys(data.attempts).length,10],['🏆','Terminer 3 missions',data.completed.length,3]].map(([icon,name,n,target])=>`<div class="world"><div class="world-icon">${icon}</div><div><strong>${name}</strong><small>${Math.min(n,target)} / ${target}</small></div></div>`).join('')}</div>`}
function profile(){root.innerHTML=`<div class="page"><div class="hero"><div><h1>Ton profil d'aventurier</h1><p>Chaque mission te rapproche de la prochaine conversation.</p></div><div class="fox">${avatarPicture(myAvatar())}</div></div><div class="card"><h2>👤 Profil local : ${esc(activeProfile)}</h2><div class="avatar-current"><span>${avatarPicture(myAvatar())}</span><div><strong>Ton avatar</strong><p class="muted">Personnalise ton aventurier !</p><button class="secondary" onclick="avatarPicker()">🎨 Choisir mon avatar</button></div></div><p class="muted">Ta progression est enregistrée automatiquement sur cet appareil. Pour la retrouver sur un autre appareil, une future synchronisation cloud sera nécessaire.</p><div class="row"><button class="secondary" onclick="createProfile()">＋ Nouveau profil</button><button class="secondary" onclick="switchProfile()">⇄ Changer</button></div><button class="secondary" style="margin-top:10px" onclick="exportProgress()">⬇ Sauvegarder mes données</button><button class="secondary" style="margin-top:10px" onclick="importProgress()">⬆ Restaurer une sauvegarde</button></div><div class="grid" style="margin-top:20px"><div class="metric"><strong>${data.xp}</strong>XP</div><div class="metric"><strong>${data.streak}</strong>Jours de série</div><div class="metric"><strong>${data.completed.length}</strong>Missions terminées</div><div class="metric"><strong>${Object.keys(data.attempts).length}</strong>Mots travaillés</div></div><button class="secondary" style="width:100%;margin:15px 0" onclick="cinemaGallery()">🎬 Voir les cinématiques du renard</button><div class="card"><h2>⚙️ Préférences</h2><label><input type="checkbox" ${data.sound?'checked':''} onchange="data.sound=this.checked;save()"> Effets sonores</label><p class="muted">Prononciation : voix luxembourgeoise Mia (RHVoice), chargée en ligne. Nécessite une connexion Internet. Appuie sur 🔊 pour tester.</p><p id="voiceNotice" class="smallnote"></p></div></div>`}

function createProfile(){let n=prompt('Nom du nouvel aventurier (sur cet appareil) :');if(n===null)return;n=n.trim().slice(0,30);if(!n)return alert('Entre un nom.');if(profiles[n])return alert('Ce profil existe déjà.');save();activeProfile=n;data={xp:0,streak:0,last:'',completed:[],attempts:{},sound:true};save();session=null;navigate('profile')}
function switchProfile(){save();let names=Object.keys(profiles);let n=prompt('Choisis un profil existant :\n'+names.join('\n'),activeProfile);if(!n)return;n=n.trim();if(!profiles[n])return alert('Profil introuvable.');activeProfile=n;data={xp:0,streak:0,last:'',completed:[],attempts:{},sound:true,...profiles[n]};save();session=null;navigate('profile')}
function exportProgress(){save();let blob=new Blob([JSON.stringify({app:'LetzLearn',version:90,profiles,activeProfile},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='letzlearn-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function importProgress(){let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{let obj=JSON.parse(await inp.files[0].text());if(obj.app!=='LetzLearn'||!obj.profiles||typeof obj.profiles!=='object')throw Error('Format non reconnu');if(!confirm('Importer ces profils ? Les profils portant le même nom seront remplacés.'))return;profiles={...profiles,...obj.profiles};activeProfile=profiles[obj.activeProfile]?obj.activeProfile:Object.keys(profiles)[0];data={xp:0,streak:0,last:'',completed:[],attempts:{},sound:true,...profiles[activeProfile]};save();navigate('profile')}catch(e){alert('Sauvegarde invalide : '+e.message)}};inp.click()}

const introCards=[
{emoji:'👋',fr:'Bonjour !',lb:'Moien',story:'Tu arrives au village. Le renard te salue !',task:'Écoute le mot puis découvre son sens.'},
{emoji:'💛',fr:'Merci',lb:'Merci',story:'Quelqu’un t’aide à retrouver ton chemin.',task:'Un mot très utile, et facile à retenir.'},
{emoji:'👋',fr:'Au revoir',lb:'Äddi',story:'Tu quittes ton nouvel ami.',task:'Écoute comment lui dire au revoir.'}
];
let introIndex=0,introCorrect=0,introPick=null;
function introStep(i){introIndex=i;introPick=null;session={intro:true};head();if(i>=6){data.completed.includes('0-0')||data.completed.push('0-0');data.xp+=60;save();session=null;head();root.innerHTML=`<div class="page reward">${foxMovie('chest')}<h1>🎉 Ta première aventure !</h1><p>Tu sais déjà saluer, remercier et dire au revoir !</p><div class="xp">+60 XP</div><button class="big" onclick="openWorld(0)">CONTINUER</button></div>`;burst(45);return}
let c=introCards[Math.min(i,2)],learn=i<3;
if(learn){root.innerHTML=`<div class="page"><div class="lessonhead"><button onclick="quit()">×</button><div class="progress"><div style="width:${i/6*100}%"></div></div><b>🦊</b></div><div class="scene" style="font-size:75px;animation:float 2s ease-in-out infinite">${c.emoji} 🦊</div><p class="muted">DÉCOUVERTE ${i+1}/3 · PAS DE PIÈGE</p><h1>${esc(c.story)}</h1><div class="card" style="text-align:center"><p>${esc(c.fr)}</p><h1 style="font-size:40px;color:#20975d">${esc(c.lb)}</h1><button class="secondary" onclick="speak('${c.lb.replace(/'/g,"\\'")}')">🔊 ÉCOUTER EN LUXEMBOURGEOIS</button><p id="voiceNotice" class="smallnote"></p></div><p class="muted">${esc(c.task)}</p><button class="big" onclick="introStep(${i+1})">J'AI COMPRIS →</button></div>`}
else{const idx=i-3,c=introCards[idx],choices=idx===0?['Äddi','Moien','Nee']:idx===1?['Merci','Jo','Moien']:['Merci','Äddi','Jo'];root.innerHTML=`<div class="page"><div class="lessonhead"><button onclick="quit()">×</button><div class="progress"><div style="width:${i/6*100}%"></div></div><b>💛</b></div><p class="muted">À TON TOUR · ${idx+1}/3</p><div class="scene" style="font-size:70px">🦊 ${c.emoji}</div><h1>Comment dit-on « ${esc(c.fr)} » ?</h1><p class="muted">Tu viens de l'apprendre. Choisis la bonne réponse !</p><div class="choices">${choices.map(x=>`<button class="choice" onclick="introSelect(this,'${x}')">${x}</button>`).join('')}</div><div id="feedback"></div><button id="check" class="big" disabled onclick="introValidate()">VÉRIFIER</button><p id="voiceNotice" class="smallnote"></p></div>`}}
function introSelect(b,v){if(introPick==='done')return;introPick=v;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('check').disabled=false;fx('tap')}
function introValidate(){const i=introIndex,c=introCards[i-3];if(introPick==='done'){introStep(i+1);return}if(introPick===c.lb){fx('yes');burst(16);$('feedback').innerHTML=`<div class="feedback good">✨ Bravo ! ${esc(c.lb)} veut dire ${esc(c.fr)}.</div>`;speak(c.lb)}else{fx('no');$('feedback').innerHTML=`<div class="feedback bad">💛 Pas grave ! La bonne réponse est ${esc(c.lb)}. Réécoutons-la.</div>`;speak(c.lb)}introPick='done';$('check').textContent='CONTINUER';$('check').disabled=false}
function start(w,m,rev=false){if(w===0&&m===0&&!rev&&!data.completed.includes('0-0')){introStep(0);return}const base=w===0?lex.slice(0,9):lex.slice(8,17);const old=lex.slice(0,9);let pool=rev?lex.filter(x=>{const a=data.attempts[x.id]||{};return (a.wrong||0)>0||((a.right||0)>0&&(!a.nextReview||a.nextReview<=Date.now()))}):base;if(pool.length<4)pool=rev?lex.slice(0,12):base;const mixed=rev?[...pool].sort((a,b)=>(data.attempts[a.id]?.nextReview||0)-(data.attempts[b.id]?.nextReview||0)):mix([...base,...mix(old).slice(0,3)]);const types=['choice','scene','build','reverse','pairs','write','listen','fill'];const qs=types.map((type,i)=>{const word=mixed[i%mixed.length];return {type,word}});session={w,m,rev,qs,index:0,correct:0,hearts:5,combo:0,xp:0};selected=null;answered=false;showAdventure('start')}
function options(word,field){let arr=[word[field]];for(const x of mix(lex.filter(x=>x.id!==word.id))){if(!arr.includes(x[field]))arr.push(x[field]);if(arr.length===4)break}return mix(arr)}
function renderQuestion(){let s=session,q=s.qs[s.index],w=q.word;selected=null;answered=false;sequence=[];pairFound=[];pairSelected=null;let html=`<div class="page"><div class="lessonhead"><button onclick="quit()">×</button><div class="progress"><div style="width:${s.index/s.qs.length*100}%"></div></div><b>❤️ ${s.hearts}</b></div><p class="muted">${['TRADUCTION','DIALOGUE','CONSTRUCTION','COMPRÉHENSION','ASSOCIATIONS','ÉCRITURE','ÉCOUTE','MOT MANQUANT'][s.index]} · ${s.index+1}/${s.qs.length}</p>`;
if(q.type==='choice'||q.type==='scene'){html+=q.type==='scene'?`<div class="character"><div class="face">🦊</div><div class="bubble">Aide-moi à dire « ${esc(w.fr)} » !</div></div>`:`<h1>Comment dit-on « ${esc(w.fr)} » ?</h1>`;html+=`<div class="choices">${options(w,'lb').map(v=>`<button class="choice" data-v="${esc(v)}" onclick="pick(this)">${esc(v)}</button>`).join('')}</div>`}
if(q.type==='reverse'){html+=`<h1>Que signifie « ${esc(w.lb)} » ?</h1><div class="choices">${options(w,'fr').map(v=>`<button class="choice" data-v="${esc(v)}" onclick="pick(this)">${esc(v)}</button>`).join('')}</div>`}
if(q.type==='listen'){html+=`<h1>Écoute et trouve la traduction</h1><div class="scene"><button class="secondary" onclick="speakId(${w.id})">🔊 ÉCOUTER</button></div><p id="voiceNotice" class="smallnote"></p><div class="choices">${options(w,'fr').map(v=>`<button class="choice" data-v="${esc(v)}" onclick="pick(this)">${esc(v)}</button>`).join('')}</div>`}
if(q.type==='build'){const words=w.lb.split(' '),distractors=mix(lex.flatMap(x=>x.lb.split(' ')).filter(x=>!words.includes(x)&&x.length>2)).slice(0,3);const bank=mix([...words,...distractors]);html+=`<h1>Construis : « ${esc(w.fr)} »</h1><div class="answer" id="answer"></div><div class="bank">${bank.map((v,i)=>`<button class="tile" id="tile${i}" onclick="addWord(${i})">${esc(v)}</button>`).join('')}</div>`}
if(q.type==='write'){html+=`<h1>✍️ Écris en luxembourgeois</h1><p class="muted">${esc(w.fr)}</p><input id="written" class="write-input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Écris ta réponse…" oninput="$('check').disabled=!this.value.trim()"><p class="smallnote">Astuce : maintiens une lettre du clavier pour accéder aux accents.</p>`}
if(q.type==='fill'){const words=w.lb.split(' ');const idx=words.length>1?Math.floor(words.length/2):0;s.missingWord=words[idx];html+=`<h1>✍️ Complète la phrase</h1><p class="muted">${esc(w.fr)}</p><div class="card" style="font-size:23px;font-weight:900;text-align:center">${words.map((v,i)=>i===idx?'_____':esc(v)).join(' ')}</div><input id="written" class="write-input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Mot manquant…" oninput="$('check').disabled=!this.value.trim()">`}
if(q.type==='pairs'){let words=mix([w,...mix(lex.filter(x=>x.id!==w.id)).slice(0,3)]);s.pairs=words;html+=`<h1>Associe les mots</h1><div class="choices">${mix(words.flatMap(x=>[{id:x.id,v:x.fr},{id:x.id,v:x.lb}])).map((x,i)=>`<button class="choice" data-pair="${x.id}" onclick="pair(this)">${esc(x.v)}</button>`).join('')}</div>`}
html+=`<div id="feedback"></div><button id="check" class="big" disabled onclick="check()">VÉRIFIER</button></div>`;root.innerHTML=html}
function pick(b){if(answered)return;document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b.dataset.v;$('check').disabled=false;fx('tap')}
function addWord(i){if(answered)return;const b=$('tile'+i);if(b.disabled)return;b.disabled=true;sequence.push({i,v:b.textContent});$('answer').innerHTML=sequence.map((x,j)=>`<button class="tile" onclick="removeWord(${j})">${esc(x.v)}</button>`).join('');$('check').disabled=!sequence.length}
function removeWord(j){const x=sequence.splice(j,1)[0];$('tile'+x.i).disabled=false;$('answer').innerHTML=sequence.map((x,k)=>`<button class="tile" onclick="removeWord(${k})">${esc(x.v)}</button>`).join('');$('check').disabled=!sequence.length}
function pair(b){if(answered||b.disabled)return;if(!pairSelected){pairSelected=b;b.classList.add('sel');return}if(pairSelected===b){b.classList.remove('sel');pairSelected=null;return}if(pairSelected.dataset.pair===b.dataset.pair){b.disabled=true;pairSelected.disabled=true;b.classList.add('good');pairSelected.classList.add('good');pairFound.push(b.dataset.pair);fx('yes');if(pairFound.length===4){selected='pairs';$('check').disabled=false}}else{fx('no');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),350)}pairSelected.classList.remove('sel');pairSelected=null}

function ll83Oral(){
 const words=lex.slice(0,12);
 root.innerHTML=`<div class="page"><button class="secondary" onclick="navigate('review')">← Retour</button><h1>🎤 Parle luxembourgeois</h1><p class="muted">Écoute, répète et entraîne-toi. La reconnaissance vocale est expérimentale et dépend du navigateur et de ses langues disponibles.</p><div id="ll83phrases">${words.map((w,i)=>`<div class="world"><div style="flex:1"><strong>${esc(w.lb)}</strong><small>${esc(w.fr)}</small></div><button class="secondary" onclick="speakId(${w.id})" aria-label="Écouter">🔊</button><button class="secondary" onclick="ll83Repeat(${i})" aria-label="Répéter">🎤</button></div>`).join('')}</div><p id="ll83speech" class="muted" role="status">Appuie sur le micro pour essayer.</p></div>`;
}
function ll83Repeat(i){
 const w=lex[i];const status=document.getElementById('ll83speech');if(!w||!status)return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){status.textContent='La reconnaissance vocale n’est pas disponible ici. Écoute la phrase et répète-la à voix haute.';return}
 try{
 const r=new SR();r.lang='lb-LU';r.interimResults=false;r.maxAlternatives=1;
 status.textContent='🎤 Je t’écoute…';r.onresult=e=>{
  const heard=e.results[0][0].transcript;
  const norm=v=>String(v).toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ').trim();
  const same=norm(heard)===norm(w.lb);
  ll83.add('oral');status.textContent=`Tu as dit : « ${heard} ». ${same?'Bravo, les mots correspondent !':'Compare avec : « '+w.lb+' » et réessaie.'} (Vérification indicative, pas une note de prononciation.)`;
 };
 r.onerror=e=>{status.textContent='Reconnaissance indisponible ('+e.error+'). Tu peux toujours écouter et répéter.'};
 r.start();
 }catch(e){status.textContent='Micro indisponible sur ce navigateur.'}
}

const ll9StartId=lex.length;
const ll9WorldLex={};
for(const [world,topic] of Object.entries(ll9Topics)){
 ll9WorldLex[world]=topic.words.map(([fr,lb])=>{const entry={fr,lb,emoji:topic.icon,id:lex.length};lex.push(entry);return entry});
}
const ll9OriginalPath=path;
path=function(){
 ll9OriginalPath();
 // Keep the existing cinematic map, but unlock the eight new playable A1 worlds.
 root.querySelectorAll('.world.locked').forEach(el=>{
  const title=el.querySelector('strong')?.textContent;
  const world=worlds.find(w=>w.name===title);
  if(world&&ll9Topics[world.index]){
   el.classList.remove('locked');
   const small=el.querySelector('small');if(small)small.textContent='3 missions jouables · 8 exercices chacune';
   const arrow=el.querySelector('b:last-child');if(arrow)arrow.textContent='▶';
  }
 });
 const p=document.createElement('div');p.className='card';p.style.marginTop='20px';
 p.innerHTML='<h2>📘 Carnet de progression</h2><p class="muted">Consulte tes mots appris, tes révisions et tes dialogues.</p><button class="secondary" onclick="ll9Journal()">OUVRIR MON CARNET</button>';
 root.querySelector('.page')?.appendChild(p);
};
const ll9OriginalOpenWorld=openWorld;
openWorld=function(i){
 if(!ll9Topics[i])return ll9OriginalOpenWorld(i);
 const topic=ll9Topics[i];
 root.innerHTML=`<div class="page"><button class="secondary" onclick="path()">← Retour aux mondes</button><div class="scene" style="font-size:65px">${topic.icon} 🦊</div><h1>${esc(topic.title)}</h1><p class="muted">Dix expressions utiles, trois missions et un dialogue interactif.</p>
 ${[0,1,2].map((m)=>`<div class="world" onclick="start(${i},${m})"><div class="world-icon">${['📖','🎯','🏆'][m]}</div><div><strong>${['Découvrir','Pratiquer','Défi final'][m]}</strong><small>8 exercices · progression sauvegardée ${data.completed.includes(i+'-'+m)?'· ✓ terminé':''}</small></div><b>▶</b></div>`).join('')}
 <div class="world" onclick="ll9Dialogue(${i})"><div class="world-icon">💬</div><div><strong>Dialogue interactif</strong><small>Écouter, comprendre et choisir une réponse</small></div><b>▶</b></div>
 <button class="secondary" style="width:100%;margin-top:14px" onclick="ll9Cards(${i})">📇 Réviser les 10 expressions</button></div>`;
};
const ll9OriginalStart=start;
start=function(w,m,rev=false){
 if(rev||!ll9Topics[w])return ll9OriginalStart(w,m,rev);
 const bank=ll9WorldLex[w];
 const previous=lex.slice(0,ll9StartId);
 const pool=m===0?bank:m===1?[...bank.slice(3),...bank.slice(0,3)]:[...bank,...previous.slice(0,5)];
 const types=['choice','scene','reverse','build','listen','write','pairs','fill'];
 const lessonWords=m===0?pool:mix(pool);
 const qs=types.map((type,i)=>({type,word:lessonWords[i%lessonWords.length]}));
 session={w,m,rev:false,qs,index:0,correct:0,hearts:5,combo:0,xp:0};
 selected=null;answered=false;showAdventure('start');
};
function ll9Cards(w){
 const t=ll9Topics[w];if(!t)return;
 root.innerHTML=`<div class="page"><button class="secondary" onclick="openWorld(${w})">← Retour au monde</button><h1>📇 ${esc(t.title)}</h1><p class="muted">Écoute et répète chaque expression à ton rythme.</p>${ll9WorldLex[w].map(x=>`<div class="world"><div style="flex:1"><strong>${esc(x.lb)}</strong><small>${esc(x.fr)}</small></div><button class="secondary" onclick="speakId(${x.id})">🔊</button></div>`).join('')}<p id="voiceNotice" class="smallnote"></p></div>`;
}
function ll9Dialogue(w){
 const t=ll9Topics[w];if(!t)return;
 const [question,spoken,answer,reply]=t.dialogue;
 const distractors=mix(ll9WorldLex[w].map(x=>x.lb).filter(x=>x!==reply)).slice(0,2);
 const choices=mix([reply,...distractors]);
 root.innerHTML=`<div class="page"><button class="secondary" onclick="openWorld(${w})">← Retour</button><h1>💬 Dialogue : ${esc(t.title)}</h1><div class="character"><div class="face">🦊</div><div class="bubble">${esc(spoken)}</div></div><p>${esc(question)}</p><button class="secondary" onclick="speak(${JSON.stringify(spoken).replace(/"/g,'&quot;')})">🔊 ÉCOUTER</button><h2>Que réponds-tu ?</h2><p class="muted">${esc(answer)}</p><div class="choices">${choices.map((v,i)=>`<button class="choice" data-dialogue="${i}" onclick="ll9DialogueAnswer(${w},this,${JSON.stringify(v).replace(/"/g,'&quot;')})">${esc(v)}</button>`).join('')}</div><div id="ll9feedback" role="status"></div><p id="voiceNotice" class="smallnote"></p></div>`;
}
function ll9SpeakDialogue(w){speak(ll9Topics[w].dialogue[1])}
function ll9DialogueAnswer(w,btn,i){
 const t=ll9Topics[w];const choice=btn.textContent;const correct=choice===t.dialogue[3];
 document.querySelectorAll('[data-dialogue]').forEach(b=>b.disabled=true);
 btn.classList.add(correct?'good':'bad');
 const key='ll9_dialogues';const scores=JSON.parse(localStorage.getItem(key)||'{}');
 scores[w]={correct,at:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(scores));
 const fb=document.getElementById('ll9feedback');
 fb.innerHTML=`<div class="feedback ${correct?'good':'bad'}">${correct?'✨ Bien joué !':'Essaie de retenir la bonne réponse :'} ${esc(t.dialogue[3])}</div><button class="big" onclick="ll9Dialogue(${w})">REJOUER LE DIALOGUE</button>`;
 if(correct){fx('yes');burst(12)}else fx('no');
}
function ll9Journal(){
 const attempted=lex.filter(x=>data.attempts[x.id]);
 const due=attempted.filter(x=>(data.attempts[x.id]?.nextReview||0)<=Date.now());
 const correct=attempted.filter(x=>(data.attempts[x.id]?.right||0)>0);
 const done=data.completed.filter(id=>/^\d+-\d+$/.test(id));
 const scores=JSON.parse(localStorage.getItem('ll9_dialogues')||'{}');
 root.innerHTML=`<div class="page"><button class="secondary" onclick="path()">← Retour</button><h1>📘 Mon carnet</h1><div class="grid"><div class="metric"><strong>${correct.length}</strong>Expressions pratiquées avec succès</div><div class="metric"><strong>${due.length}</strong>Révisions à faire</div><div class="metric"><strong>${done.length}</strong>Missions terminées</div><div class="metric"><strong>${Object.values(scores).filter(x=>x.correct).length}</strong>Dialogues réussis</div></div><h2>Mes expressions à revoir</h2>${(due.length?due:lex.slice(0,5)).slice(0,20).map(x=>`<div class="world"><div style="flex:1"><strong>${esc(x.lb)}</strong><small>${esc(x.fr)}</small></div><button class="secondary" onclick="speakId(${x.id})">🔊</button></div>`).join('')}<button class="big" onclick="navigate('review')">LANCER UNE RÉVISION</button><p id="voiceNotice" class="smallnote"></p></div>`;
}
