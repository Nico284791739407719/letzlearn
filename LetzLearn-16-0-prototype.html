const app=document.getElementById('app');function persist(){try{localStorage.setItem('letzlearn12',JSON.stringify({completed:S.completed,xp:S.xp,streak:S.streak,lastDay:S.lastDay,lastSeen:S.lastSeen}))}catch(e){}}function done(u,m){return !!S.completed[u+'-'+m]}function count(u){return [0,1,2].filter(m=>done(u,m)).length}function available(u,m){if(u===0&&m===0)return true;if(m>0)return done(u,m-1);return done(u-1,2)}function total(){return Object.keys(S.completed).length}
function speak(t,slow=false){if('speechSynthesis'in window){speechSynthesis.cancel();const a=new SpeechSynthesisUtterance(t);a.lang='lb-LU';a.rate=slow?.55:.83;speechSynthesis.speak(a)}else alert('La synthèse vocale est indisponible dans ce navigateur.')}
function nav(p){S.page=p;S.tab=p;S.overlay=false;render();window.scrollTo(0,0)}
function headerStats(){return `<div class="top"><span class="flag">🇱🇺</span><div class="stats"><span>🔥 ${S.streak}</span><span style="color:#168fe0">💎 ${S.xp}</span><span style="color:#f05d63">❤️ ${S.hearts}</span></div></div>`}
function fox(){return FOX}function pic(key,cls=""){return `<img class="${cls}" src="${ART[key]}" alt="Illustration LëtzLearn">`}function menu(){return `<nav class="nav">${[['map','🏠','Parcours'],['chapters','🗺️','Chapitres'],['review','📚','Réviser'],['profile','🦊','Profil']].map(([id,ico,t])=>`<button class="${S.tab===id?'active':''}" onclick="nav('${id}')"><span class="ico">${ico}</span>${t}</button>`).join('')}</nav>`}
function map(){let c=count(0);let h=`<div class="screen">${headerStats()}<div class="hero" style="--map-art:url(${ART['map-art']})"><div class="unit"><small>CHAPITRE 1 · A1</small><strong>Premiers mots</strong><span class="progress"><i style="width:${c/3*100}%"></i></span><span class="count">${c}/3</span></div>`;[[50,95,1,0],[39,78,0,2],[72,52,0,1],[44,37,0,0]].forEach(([x,y,u,m])=>{h+=`<button aria-label="${u===0?'Leçon '+(m+1):'Chapitre suivant'}" class="trailnode ${done(u,m)?'done':!available(u,m)?'locked':'current'}" style="left:${x}%;top:${y}%" onclick="start(${u},${m})" ${!available(u,m)?'disabled':''}></button>`});h+=`</div></div>`;return h+menu()}
function chapters(){return `<div class="screen"><div class="top"><button class="back" onclick="nav('map')" aria-label="Retour">‹</button><strong>Chapitres</strong><span></span></div>${UNITS.map(([t,ico],i)=>`<div class="unitcard ${['yellow','blue','purple','green','pink'][i%5]} ${available(i,0)?'':'lock'}"><div class="art">${pic(['fox-scene','home-art','family-art','work-art','food-art','train-art','home-art','fox-scene','fox-scene','train-art'][i])}</div><div class="info"><small>A1 · ${i===0?'Premiers mots':'Unité '+(i+1)}</small><strong>${t}</strong><div class="progress"><i style="width:${count(i)/3*100}%"></i></div></div><button aria-label="Ouvrir ${t}" onclick="openUnit(${i})"></button></div>`).join('')}</div>${menu()}`}
function openUnit(i){S.unit=i;if(available(i,0)){let m=[0,1,2].find(x=>!done(i,x));start(i,m===undefined?2:m)}else{S.overlay='locked';render()}}
function start(u,m){if(!available(u,m))return;S.unit=u;S.step=m;S.q=0;S.wrong=0;S.selected=null;S.answered=false;S.micText='';S.page='lesson';S.overlay=false;S.review=false;S.earned=0;render();window.scrollTo(0,0)}
function question(){let v=Q[S.unit][(S.q+S.step)%3];let opts=[v.lu,...v.wrong];let offset=(S.q+S.step+S.unit)%4;opts=opts.map((_,i,a)=>a[(i+offset)%4]);return {v,opts}}
function audioOptions(){let v=question().v;let a=[v.fr,...Q[S.unit].filter(x=>x.fr!==v.fr).map(x=>x.fr),'Bonjour !'].slice(0,4);return a.map((_,j)=>a[(j+S.q+S.step)%a.length])}
function lesson(){let {v,opts}=question();let audio=S.step===1;let title=audio?'Écoute et répète cette phrase':S.step===2?'Relève le défi !':'Choisis la bonne réponse';return `<div class="screen"><div class="lessonbar"><button class="back" aria-label="Quitter" onclick="nav('chapters')">×</button><div class="progress"><i style="width:${(S.q+1)/3*100}%"></i></div><span class="hearts">❤️ ${S.hearts}</span></div><h2 class="question">${title}</h2>${audio?`<div class="promptcard">${pic('fox-scene','foxart')}<div class="speech"><button class="speaker" aria-label="Écouter la phrase" onclick="speak(question().v.lu)">🔊</button><div style="margin-top:8px">${v.lu}</div></div></div><div class="lesson-actions"><button class="audio-button" aria-label="Écouter" onclick="speak(question().v.lu)">🔊</button><button class="audio-button small" aria-label="Parler" onclick="practiceSpeech()">🎙</button><button class="audio-button small slow" aria-label="Écouter lentement" onclick="speak(question().v.lu,true)">🐢</button></div><p class="sub" style="text-align:center">${S.micText||'Écoute puis choisis la traduction française.'}</p>`:`<div class="promptcard">${pic('fox-scene','foxart')}<div class="speech">${v.fr}</div></div><p class="sub">Comment dit-on « ${v.fr} » en luxembourgeois ?</p>`}<div class="choices">${(audio?audioOptions():opts).map((o,i)=>`<button class="choice ${S.selected===i?(S.answered&&o!==(audio?v.fr:v.lu)?'wrong':'selected'):''}" onclick="select(${i})" ${S.answered?'disabled':''}>${o}</button>`).join('')}</div><div class="lesson-spacer"></div>${S.answered?`<div class="feedback ${S.wasCorrect?'':'bad'}"><strong>${S.wasCorrect?'✓ Super !':'On continue !'}</strong><p>${S.wasCorrect?'Bonne réponse !':'Bonne réponse : '+(audio?v.fr:v.lu)}</p><button class="btn" onclick="next()">Continuer</button></div>`:`<div class="bottomaction"><button class="btn" onclick="check()" ${S.selected===null?'disabled':''}>Vérifier</button></div>`}</div>`}
function select(i){if(S.answered)return;S.selected=i;render()}function check(){if(S.selected===null)return;S.answered=true;let {v,opts}=question();S.wasCorrect=S.step===1?audioOptions()[S.selected]===v.fr:opts[S.selected]===v.lu;if(!S.wasCorrect){S.wrong++;S.hearts=Math.max(0,S.hearts-1)}render()}function next(){if(S.q<2){S.q++;S.selected=null;S.answered=false;S.micText='';render()}else{if(!done(S.unit,S.step)){S.completed[S.unit+'-'+S.step]=true;S.xp+=10;S.earned=10;updateStreak();persist()}else{S.earned=0}S.page='result';render()}}

function review(){return `<div class="screen"><div class="top"><strong>Réviser</strong><span>📚</span></div><h1 class="heading">Renforce tes acquis</h1><p class="sub">Rejoue les leçons pour mémoriser les expressions déjà découvertes.</p>${UNITS.map(([name,ico],i)=>count(i)?`<div class="review"><div><strong>${ico} ${name}</strong><small>${count(i)} leçon(s) terminée(s)</small></div><button class="btn" style="width:auto;min-height:45px" onclick="start(${i},0)">Réviser</button></div>`:'').join('')||'<div class="review">Termine ta première leçon pour débloquer les révisions.</div>'}</div>${menu()}`}
function overlay(){return `<div class="overlay"><div class="modal">${pic("chest-art","unlockart")}<h2>${S.overlay==='unlock'?'Nouveau chapitre débloqué !':'Encore un peu de patience !'}</h2><p>${S.overlay==='unlock'?'Bravo ! Tu peux commencer la prochaine unité.':'Termine les leçons précédentes pour débloquer ce chapitre.'}</p><button class="btn" onclick="S.overlay=false;render()">Continuer</button></div></div>`}

function updateStreak(){let d=new Date(),today=d.toLocaleDateString('en-CA'),yesterday=new Date(d.getTime()-86400000).toLocaleDateString('en-CA');if(S.lastDay!==today){S.streak=S.lastDay===yesterday?S.streak+1:1;S.lastDay=today}}
function practiceSpeech(){let Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){S.micText='La reconnaissance vocale n’est pas disponible ici. Utilise l’écoute et les réponses.';render();return}let r=new Rec();r.lang='lb-LU';r.interimResults=false;S.micText='Je t’écoute…';render();r.onresult=e=>{S.micText='Tu as dit : '+e.results[0][0].transcript;render()};r.onerror=()=>{S.micText='Micro indisponible ou langue non reconnue. Tu peux poursuivre la leçon.';render()};try{r.start()}catch(e){S.micText='Micro indisponible.';render()}}
function summary(){return `<div class="screen"><div class="top"><button class="back" onclick="S.page='result';render()">‹</button><strong>Résumé de la leçon</strong><span></span></div><h1 class="heading">${UNITS[S.unit][0]}</h1>${Q[S.unit].map(x=>`<div class="review"><div><strong>${x.lu}</strong><small>${x.fr}</small></div><button class="audio-button small" aria-label="Écouter" onclick="speak(${JSON.stringify(x.lu).replace(/"/g,'&quot;')})">🔊</button></div>`).join('')}<button class="btn" onclick="finish()">Continuer</button></div>`}
function correctscreen(){return `<div class="screen correctscreen"><button class="back" style="display:block" onclick="next()">×</button>${pic('fox-scene','resultart')}<h1>Super !</h1><div class="xp">+${S.earned||10} XP</div><div class="streak">🔥 Série du jour<br><b>${S.streak} jour${S.streak>1?'s':''}</b></div><button class="btn" onclick="next()">Continuer</button></div>`}
function render(){app.innerHTML=({map,chapters,lesson,result,profile,review,summary,correctscreen}[S.page]||map)()+(S.overlay?overlay():'')}
render();
</script><script>
function map(){
 const c=count(0);
 let h=`<div class="screen"><div class="ll15-top"><span class="flag">🇱🇺</span><div class="stats"><span>🔥 ${S.streak}</span><span style="color:#168fe0">💎 ${S.xp}</span><span style="color:#f05d63">❤️ ${S.hearts}</span></div></div><div class="ll15-banner"><button class="ll15-chapterlink" onclick="nav('chapters')">CHAPITRES ›</button><div class="small">CHAPITRE 1 · A1</div><strong>Premiers mots</strong><span class="progress"><i style="width:${c/3*100}%"></i></span><span class="count">${c}/3</span></div><div class="ll15-map"><img class="map-art" src="${ART['map-art']}" alt="Parcours illustré : renard, château, chemin sinueux et coffres" draggable="false">`;
 const stops=[{x:37,y:35,u:0,m:0,n:'Découvrir les premiers mots'},{x:70,y:50,u:0,m:1,n:'Pratiquer'},{x:40,y:76,u:0,m:2,n:'Défi final'},{x:59,y:64,u:1,m:0,n:'Coffre du chapitre suivant'}];
 for(const p of stops){const on=available(p.u,p.m);h+=`<button class="ll15-hotspot ${on&&!done(p.u,p.m)?'current':''} ${done(p.u,p.m)?'completed':''}" style="left:${p.x}%;top:${p.y}%" aria-label="${p.n}${on?'':' — verrouillé'}" ${on?`onclick="start(${p.u},${p.m})"`:'disabled'}></button>`}
 h+=`</div><div class="ll15-after"><h2>Explore le Luxembourg</h2><p>Termine les trois missions pour débloquer le prochain chapitre.</p></div></div>`;
 return h+menu();
}
render();
</script></body></html>
